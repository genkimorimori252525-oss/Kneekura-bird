import java.util.regex.Pattern
import org.gradle.api.tasks.compile.JavaCompile

// Temporary experiment harness for one behavioral hypothesis. The repository Java sources remain
// unchanged; a fresh validation workspace applies these exact checked replacements before compile.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        File adapterSource = file('src/main/java/com/wwdebug/autopilot/EnergyFighterApexYawAdapter.java')
        String adapter = adapterSource.getText('UTF-8').replace('\r\n', '\n')

        String oldConstants = [
                '    private static final double ATTACK_MAX_RAW_ANGLE_DEG = 45.0;',
                '    private static final double ATTACK_MAX_LEAD_ANGLE_DEG = 12.0;'
        ].join('\n')
        String newConstants = [
                '    private static final double CAPTURE_HORIZONTAL_IMPROVEMENT_EPSILON_DEG = 0.20;',
                '    private static final double CAPTURE_REVERSAL_TRIGGER_REGRESSION_DEG = 4.0;',
                '    private static final double CAPTURE_REVERSAL_MIN_DISTANCE = 55.0;',
                '    private static final double CAPTURE_REVERSAL_MAX_DISTANCE = 125.0;',
                '    private static final double CAPTURE_REVERSAL_MIN_CLOSURE_BPS = 8.0;',
                '    private static final double CAPTURE_REVERSAL_INPUT = 0.94;',
                '    private static final double CAPTURE_MAX_DESCENT_PITCH_DEG = 20.0;',
                '    private static final int CAPTURE_REVERSAL_MIN_TICKS = 20;',
                '    private static final int CAPTURE_REVERSAL_STALL_TICKS = 3;',
                '    private static final int CAPTURE_REVERSAL_TIMEOUT_TICKS = 90;',
                '',
                '    private static final double ATTACK_MAX_RAW_ANGLE_DEG = 45.0;',
                '    private static final double ATTACK_MAX_LEAD_ANGLE_DEG = 12.0;'
        ].join('\n')

        String oldCapture = [
                '        if (state.stage == Stage.CAPTURE) {',
                '            boolean attackSector = target.lineOfSight()',
                '                    && rawAngle <= ATTACK_MAX_RAW_ANGLE_DEG',
                '                    && leadAngle <= ATTACK_MAX_LEAD_ANGLE_DEG',
                '                    && distance >= ATTACK_MIN_DISTANCE && distance <= ATTACK_MAX_DISTANCE',
                '                    && closure >= ATTACK_MIN_CLOSURE_BPS',
                '                    && closure <= ATTACK_MAX_CLOSURE_BPS;',
                '            if (attackSector) {',
                '                transition(level, aircraft, session.get().phase(), state, snapshot,',
                '                        distance, rawAngle, leadAngle, closure, threat.aimAngleDeg(),',
                '                        Stage.DOCTRINE, "attack_sector_reached");',
                '            } else if (state.stageTicks >= MAX_CAPTURE_TICKS || distance > 190.0) {',
                '                finish(level, aircraft, session.get().phase(), "capture_timeout", true);',
                '                return false;',
                '            }',
                '        }'
        ].join('\n')
        String newCapture = [
                '        if (state.stage == Stage.CAPTURE) {',
                '            double absoluteHorizontalError = Math.abs(horizontalLeadError);',
                '            if (!state.captureTurnReversed) {',
                '                if (absoluteHorizontalError + CAPTURE_HORIZONTAL_IMPROVEMENT_EPSILON_DEG',
                '                        < state.bestCaptureHorizontalError) {',
                '                    state.bestCaptureHorizontalError = absoluteHorizontalError;',
                '                    state.captureHorizontalStalledTicks = 0;',
                '                } else if (state.stageTicks >= CAPTURE_REVERSAL_MIN_TICKS',
                '                        && absoluteHorizontalError >= state.bestCaptureHorizontalError',
                '                        + CAPTURE_REVERSAL_TRIGGER_REGRESSION_DEG) {',
                '                    state.captureHorizontalStalledTicks++;',
                '                } else {',
                '                    state.captureHorizontalStalledTicks = 0;',
                '                }',
                '',
                '                boolean reverseAcrossTurn = target.lineOfSight()',
                '                        && state.stageTicks >= CAPTURE_REVERSAL_MIN_TICKS',
                '                        && state.captureHorizontalStalledTicks',
                '                        >= CAPTURE_REVERSAL_STALL_TICKS',
                '                        && distance >= CAPTURE_REVERSAL_MIN_DISTANCE',
                '                        && distance <= CAPTURE_REVERSAL_MAX_DISTANCE',
                '                        && closure >= CAPTURE_REVERSAL_MIN_CLOSURE_BPS;',
                '                if (reverseAcrossTurn) {',
                '                    state.captureTurnReversed = true;',
                '                    state.captureReverseInputSign = -Math.copySign(',
                '                            1.0, horizontalLeadError);',
                '                    state.captureReverseTicks = 0;',
                '                    writeEvent(level, aircraft, session.get().phase(),',
                '                            "energy_coupled_capture_reversal", state, snapshot,',
                '                            distance, rawAngle, leadAngle, closure,',
                '                            threat.aimAngleDeg(), "horizontal_local_minimum_cross_turn");',
                '                }',
                '            } else {',
                '                state.captureReverseTicks++;',
                '            }',
                '',
                '            boolean attackSector = target.lineOfSight()',
                '                    && rawAngle <= ATTACK_MAX_RAW_ANGLE_DEG',
                '                    && leadAngle <= ATTACK_MAX_LEAD_ANGLE_DEG',
                '                    && distance >= ATTACK_MIN_DISTANCE && distance <= ATTACK_MAX_DISTANCE',
                '                    && closure >= ATTACK_MIN_CLOSURE_BPS',
                '                    && closure <= ATTACK_MAX_CLOSURE_BPS;',
                '            if (attackSector) {',
                '                transition(level, aircraft, session.get().phase(), state, snapshot,',
                '                        distance, rawAngle, leadAngle, closure, threat.aimAngleDeg(),',
                '                        Stage.DOCTRINE, "attack_sector_reached");',
                '            } else if (state.captureTurnReversed',
                '                    && state.captureReverseTicks >= CAPTURE_REVERSAL_TIMEOUT_TICKS) {',
                '                finish(level, aircraft, session.get().phase(),',
                '                        "capture_reversal_timeout", true);',
                '                return false;',
                '            } else if (state.stageTicks >= MAX_CAPTURE_TICKS || distance > 190.0) {',
                '                finish(level, aircraft, session.get().phase(), "capture_timeout", true);',
                '                return false;',
                '            }',
                '        }'
        ].join('\n')

        String oldApplyCapture = [
                '    private static void applyCapture(ServerLevel level, Entity aircraft, Entity target,',
                '                                     FlightSnapshot snapshot, FlightProfile profile,',
                '                                     Vec3 leadDirection, double headingError,',
                '                                     double yawRate, double pitchRate, State state,',
                '                                     double rawAngle, double leadAngle, double closure,',
                '                                     FlightPhase phase) {',
                '        float x = (float) Mth.clamp(',
                '                headingError / 18.0 - YAW_RATE_DAMPING * yawRate,',
                '                -0.94, 0.94);',
                '        double desiredPitch = desiredPitchDegrees(leadDirection);',
                '        float z = (float) Mth.clamp(',
                '                (desiredPitch - snapshot.pitchDeg()) / CAPTURE_PITCH_DIVISOR',
                '                        - CAPTURE_PITCH_RATE_DAMPING * pitchRate,',
                '                -0.88, 0.88);',
                '        double targetAltitude = target.getBoundingBox().getCenter().y + 4.0;',
                '        double altitudeError = targetAltitude - snapshot.position().y;',
                '        double targetSpeed = Math.max(profile.cruiseSpeedBps(),',
                '                target.getDeltaMovement().horizontalDistance() * 20.0 + 3.0);',
                '        float engine = snapshot.speedBps() < targetSpeed - 1.0 ? 1.0f',
                '                : snapshot.speedBps() > targetSpeed + 3.0 ? 0.30f : 0.65f;',
                '        FlightControlOutput output = new FlightControlOutput(x, 0.0f, z, engine,',
                '                leadDirection, targetAltitude, targetSpeed,',
                '                headingError, altitudeError, targetSpeed - snapshot.speedBps(),',
                '                snapshot.speedBps() < profile.stallGuardSpeedBps(), false,',
                '                "energy_coupled_capture", "damped_vector_capture_after_climbing_turn");',
                '        applyAndLog(level, aircraft, snapshot, output, state,',
                '                rawAngle, leadAngle, closure, phase);',
                '    }'
        ].join('\n')
        String newApplyCapture = [
                '    private static void applyCapture(ServerLevel level, Entity aircraft, Entity target,',
                '                                     FlightSnapshot snapshot, FlightProfile profile,',
                '                                     Vec3 leadDirection, double headingError,',
                '                                     double yawRate, double pitchRate, State state,',
                '                                     double rawAngle, double leadAngle, double closure,',
                '                                     FlightPhase phase) {',
                '        float x;',
                '        if (state.captureTurnReversed) {',
                '            x = (float) (state.captureReverseInputSign * CAPTURE_REVERSAL_INPUT);',
                '        } else {',
                '            x = (float) Mth.clamp(',
                '                    headingError / 18.0 - YAW_RATE_DAMPING * yawRate,',
                '                    -0.94, 0.94);',
                '        }',
                '        double desiredPitch = desiredPitchDegrees(leadDirection);',
                '        if (state.captureTurnReversed) {',
                '            desiredPitch = Mth.clamp(desiredPitch, -8.0,',
                '                    CAPTURE_MAX_DESCENT_PITCH_DEG);',
                '        }',
                '        float z = (float) Mth.clamp(',
                '                (desiredPitch - snapshot.pitchDeg()) / CAPTURE_PITCH_DIVISOR',
                '                        - CAPTURE_PITCH_RATE_DAMPING * pitchRate,',
                '                -0.88, 0.88);',
                '        double targetAltitude = target.getBoundingBox().getCenter().y + 4.0;',
                '        double altitudeError = targetAltitude - snapshot.position().y;',
                '        double targetSpeed = Math.max(profile.cruiseSpeedBps(),',
                '                target.getDeltaMovement().horizontalDistance() * 20.0 + 3.0);',
                '        float engine = snapshot.speedBps() < targetSpeed - 1.0 ? 1.0f',
                '                : snapshot.speedBps() > targetSpeed + 3.0 ? 0.30f : 0.65f;',
                '        if (state.captureTurnReversed) {',
                '            engine = Math.max(engine, 0.65f);',
                '        }',
                '        FlightControlOutput output = new FlightControlOutput(x, 0.0f, z, engine,',
                '                leadDirection, targetAltitude, targetSpeed,',
                '                headingError, altitudeError, targetSpeed - snapshot.speedBps(),',
                '                snapshot.speedBps() < profile.stallGuardSpeedBps(), false,',
                '                "energy_coupled_capture",',
                '                state.captureTurnReversed',
                '                        ? "horizontal_local_minimum_cross_turn"',
                '                        : "damped_vector_capture_after_climbing_turn");',
                '        applyAndLog(level, aircraft, snapshot, output, state,',
                '                rawAngle, leadAngle, closure, phase);',
                '    }'
        ].join('\n')

        String oldDescriptionTail = [
                '                + ":turn_sign=" + state.turnSign',
                '                + ":max_yaw_change=" + round(state.maxYawChangeDeg);'
        ].join('\n')
        String newDescriptionTail = [
                '                + ":turn_sign=" + state.turnSign',
                '                + ":max_yaw_change=" + round(state.maxYawChangeDeg)',
                '                + ":best_capture_horizontal_error="',
                '                + round(state.bestCaptureHorizontalError)',
                '                + ":capture_horizontal_stalled_ticks="',
                '                + state.captureHorizontalStalledTicks',
                '                + ":capture_turn_reversed=" + state.captureTurnReversed',
                '                + ":capture_reverse_input_sign="',
                '                + state.captureReverseInputSign',
                '                + ":capture_reverse_ticks=" + state.captureReverseTicks;'
        ].join('\n')

        String oldStateFields = [
                '        private double lastYawDeg;',
                '        private double lastPitchDeg;',
                '        private int totalTicks;'
        ].join('\n')
        String newStateFields = [
                '        private double lastYawDeg;',
                '        private double lastPitchDeg;',
                '        private double bestCaptureHorizontalError = Double.POSITIVE_INFINITY;',
                '        private double captureReverseInputSign;',
                '        private int captureHorizontalStalledTicks;',
                '        private int captureReverseTicks;',
                '        private boolean captureTurnReversed;',
                '        private int totalTicks;'
        ].join('\n')

        boolean fullyApplied = adapter.contains('CAPTURE_REVERSAL_TRIGGER_REGRESSION_DEG')
                && adapter.contains('horizontal_local_minimum_cross_turn')
                && adapter.contains('captureTurnReversed')
        if (fullyApplied) {
            logger.lifecycle('Coupled-climb horizontal cross-turn experiment already applied in this workspace.')
            return
        }

        int constantsCount = adapter.split(Pattern.quote(oldConstants), -1).length - 1
        int captureCount = adapter.split(Pattern.quote(oldCapture), -1).length - 1
        int applyCaptureCount = adapter.split(Pattern.quote(oldApplyCapture), -1).length - 1
        int descriptionCount = adapter.split(Pattern.quote(oldDescriptionTail), -1).length - 1
        int stateCount = adapter.split(Pattern.quote(oldStateFields), -1).length - 1
        if (constantsCount != 1 || captureCount != 1 || applyCaptureCount != 1
                || descriptionCount != 1 || stateCount != 1) {
            throw new GradleException('Refusing horizontal cross-turn experiment: '
                    + "constants=${constantsCount}, capture=${captureCount}, "
                    + "applyCapture=${applyCaptureCount}, description=${descriptionCount}, "
                    + "state=${stateCount}")
        }

        adapter = adapter.replace(oldConstants, newConstants)
                .replace(oldCapture, newCapture)
                .replace(oldApplyCapture, newApplyCapture)
                .replace(oldDescriptionTail, newDescriptionTail)
                .replace(oldStateFields, newStateFields)
        adapterSource.setText(adapter, 'UTF-8')
        logger.lifecycle('Applied CAPTURE horizontal-local-minimum cross-turn experiment.')
    }
}
