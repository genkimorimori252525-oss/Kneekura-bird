import java.util.regex.Pattern
import org.gradle.api.tasks.compile.JavaCompile

// Temporary experiment harness for one behavioral hypothesis. The repository Java sources remain
// unchanged; a fresh validation workspace applies these exact checked replacements before compile.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        File adapterSource = file('src/main/java/com/wwdebug/autopilot/EnergyFighterApexYawAdapter.java')
        String adapter = adapterSource.getText('UTF-8').replace('\r\n', '\n')

        String oldConstants = [
                '    private static final double ATTACK_MAX_RAW_ANGLE_DEG = 45.0;',
                '    private static final double ATTACK_MAX_LEAD_ANGLE_DEG = 12.0;'
        ].join('\n')
        String newConstants = [
                '    private static final double CAPTURE_SATURATION_MAX_IMPROVEMENT_DEG = 0.15;',
                '    private static final double CAPTURE_LAG_MAX_HORIZONTAL_ERROR_DEG = 72.0;',
                '    private static final double CAPTURE_LAG_MIN_DISTANCE = 70.0;',
                '    private static final double CAPTURE_LAG_MAX_DISTANCE = 125.0;',
                '    private static final double CAPTURE_LAG_MIN_CLOSURE_BPS = 10.0;',
                '    private static final double CAPTURE_LAG_RELEASE_CLOSURE_BPS = 4.0;',
                '    private static final double CAPTURE_LAG_CLIMB_PITCH_DEG = -18.0;',
                '    private static final double CAPTURE_LAG_TURN_INPUT = 0.94;',
                '    private static final int CAPTURE_LAG_MIN_STAGE_TICKS = 20;',
                '    private static final int CAPTURE_SATURATION_TICKS = 3;',
                '    private static final int CAPTURE_LAG_MIN_TICKS = 18;',
                '    private static final int CAPTURE_LAG_MAX_TICKS = 110;',
                '',
                '    private static final double ATTACK_MAX_RAW_ANGLE_DEG = 45.0;',
                '    private static final double ATTACK_MAX_LEAD_ANGLE_DEG = 12.0;'
        ].join('\n')

        String oldCapture = [
                '        if (state.stage == Stage.CAPTURE) {',
                '            boolean attackSector = target.lineOfSight()',
                '                    && rawAngle <= ATTACK_MAX_RAW_ANGLE_DEG',
                '                    && leadAngle <= ATTACK_MAX_LEAD_ANGLE_DEG',
                '                    && distance >= ATTACK_MIN_DISTANCE && distance <= ATTACK_MAX_DISTANCE',
                '                    && closure >= ATTACK_MIN_CLOSURE_BPS',
                '                    && closure <= ATTACK_MAX_CLOSURE_BPS;',
                '            if (attackSector) {',
                '                transition(level, aircraft, session.get().phase(), state, snapshot,',
                '                        distance, rawAngle, leadAngle, closure, threat.aimAngleDeg(),',
                '                        Stage.DOCTRINE, "attack_sector_reached");',
                '            } else if (state.stageTicks >= MAX_CAPTURE_TICKS || distance > 190.0) {',
                '                finish(level, aircraft, session.get().phase(), "capture_timeout", true);',
                '                return false;',
                '            }',
                '        }'
        ].join('\n')
        String newCapture = [
                '        if (state.stage == Stage.CAPTURE) {',
                '            double absoluteHorizontalError = Math.abs(horizontalLeadError);',
                '            state.bestCaptureHorizontalError = Math.min(',
                '                    state.bestCaptureHorizontalError, absoluteHorizontalError);',
                '            double horizontalImprovement = Double.isFinite(',
                '                    state.lastCaptureHorizontalError)',
                '                    ? state.lastCaptureHorizontalError - absoluteHorizontalError',
                '                    : Double.POSITIVE_INFINITY;',
                '',
                '            if (!state.captureLagActive) {',
                '                boolean angularRateSaturated = target.lineOfSight()',
                '                        && state.stageTicks >= CAPTURE_LAG_MIN_STAGE_TICKS',
                '                        && absoluteHorizontalError',
                '                        <= CAPTURE_LAG_MAX_HORIZONTAL_ERROR_DEG',
                '                        && horizontalImprovement',
                '                        <= CAPTURE_SATURATION_MAX_IMPROVEMENT_DEG',
                '                        && distance >= CAPTURE_LAG_MIN_DISTANCE',
                '                        && distance <= CAPTURE_LAG_MAX_DISTANCE',
                '                        && closure >= CAPTURE_LAG_MIN_CLOSURE_BPS;',
                '                state.captureSaturationTicks = angularRateSaturated',
                '                        ? state.captureSaturationTicks + 1 : 0;',
                '                if (state.captureSaturationTicks >= CAPTURE_SATURATION_TICKS) {',
                '                    state.captureLagActive = true;',
                '                    state.captureLagTicks = 0;',
                '                    state.captureLagStartClosure = closure;',
                '                    state.captureLagTurnInputSign = Math.copySign(',
                '                            1.0, horizontalLeadError);',
                '                    writeEvent(level, aircraft, session.get().phase(),',
                '                            "energy_coupled_capture_lag_climb_start",',
                '                            state, snapshot, distance, rawAngle, leadAngle, closure,',
                '                            threat.aimAngleDeg(),',
                '                            "horizontal_rate_saturation_before_overshoot");',
                '                }',
                '            } else {',
                '                state.captureLagTicks++;',
                '                boolean closureRecovered = state.captureLagTicks',
                '                        >= CAPTURE_LAG_MIN_TICKS',
                '                        && closure <= CAPTURE_LAG_RELEASE_CLOSURE_BPS;',
                '                if (closureRecovered) {',
                '                    state.captureLagActive = false;',
                '                    state.captureSaturationTicks = 0;',
                '                    state.lastCaptureHorizontalError = Double.NaN;',
                '                    writeEvent(level, aircraft, session.get().phase(),',
                '                            "energy_coupled_capture_lag_climb_end",',
                '                            state, snapshot, distance, rawAngle, leadAngle, closure,',
                '                            threat.aimAngleDeg(), "closure_recovered");',
                '                } else if (state.captureLagTicks >= CAPTURE_LAG_MAX_TICKS) {',
                '                    finish(level, aircraft, session.get().phase(),',
                '                            "capture_lag_climb_timeout", true);',
                '                    return false;',
                '                }',
                '            }',
                '            state.lastCaptureHorizontalError = absoluteHorizontalError;',
                '',
                '            boolean attackSector = target.lineOfSight()',
                '                    && rawAngle <= ATTACK_MAX_RAW_ANGLE_DEG',
                '                    && leadAngle <= ATTACK_MAX_LEAD_ANGLE_DEG',
                '                    && distance >= ATTACK_MIN_DISTANCE && distance <= ATTACK_MAX_DISTANCE',
                '                    && closure >= ATTACK_MIN_CLOSURE_BPS',
                '                    && closure <= ATTACK_MAX_CLOSURE_BPS;',
                '            if (attackSector) {',
                '                transition(level, aircraft, session.get().phase(), state, snapshot,',
                '                        distance, rawAngle, leadAngle, closure, threat.aimAngleDeg(),',
                '                        Stage.DOCTRINE, "attack_sector_reached");',
                '            } else if (state.stageTicks >= MAX_CAPTURE_TICKS || distance > 190.0) {',
                '                finish(level, aircraft, session.get().phase(), "capture_timeout", true);',
                '                return false;',
                '            }',
                '        }'
        ].join('\n')

        String oldApplyCapture = [
                '    private static void applyCapture(ServerLevel level, Entity aircraft, Entity target,',
                '                                     FlightSnapshot snapshot, FlightProfile profile,',
                '                                     Vec3 leadDirection, double headingError,',
                '                                     double yawRate, double pitchRate, State state,',
                '                                     double rawAngle, double leadAngle, double closure,',
                '                                     FlightPhase phase) {',
                '        float x = (float) Mth.clamp(',
                '                headingError / 18.0 - YAW_RATE_DAMPING * yawRate,',
                '                -0.94, 0.94);',
                '        double desiredPitch = desiredPitchDegrees(leadDirection);',
                '        float z = (float) Mth.clamp(',
                '                (desiredPitch - snapshot.pitchDeg()) / CAPTURE_PITCH_DIVISOR',
                '                        - CAPTURE_PITCH_RATE_DAMPING * pitchRate,',
                '                -0.88, 0.88);',
                '        double targetAltitude = target.getBoundingBox().getCenter().y + 4.0;',
                '        double altitudeError = targetAltitude - snapshot.position().y;',
                '        double targetSpeed = Math.max(profile.cruiseSpeedBps(),',
                '                target.getDeltaMovement().horizontalDistance() * 20.0 + 3.0);',
                '        float engine = snapshot.speedBps() < targetSpeed - 1.0 ? 1.0f',
                '                : snapshot.speedBps() > targetSpeed + 3.0 ? 0.30f : 0.65f;',
                '        FlightControlOutput output = new FlightControlOutput(x, 0.0f, z, engine,',
                '                leadDirection, targetAltitude, targetSpeed,',
                '                headingError, altitudeError, targetSpeed - snapshot.speedBps(),',
                '                snapshot.speedBps() < profile.stallGuardSpeedBps(), false,',
                '                "energy_coupled_capture", "damped_vector_capture_after_climbing_turn");',
                '        applyAndLog(level, aircraft, snapshot, output, state,',
                '                rawAngle, leadAngle, closure, phase);',
                '    }'
        ].join('\n')
        String newApplyCapture = [
                '    private static void applyCapture(ServerLevel level, Entity aircraft, Entity target,',
                '                                     FlightSnapshot snapshot, FlightProfile profile,',
                '                                     Vec3 leadDirection, double headingError,',
                '                                     double yawRate, double pitchRate, State state,',
                '                                     double rawAngle, double leadAngle, double closure,',
                '                                     FlightPhase phase) {',
                '        float x = state.captureLagActive',
                '                ? (float) (state.captureLagTurnInputSign * CAPTURE_LAG_TURN_INPUT)',
                '                : (float) Mth.clamp(',
                '                headingError / 18.0 - YAW_RATE_DAMPING * yawRate,',
                '                -0.94, 0.94);',
                '        double desiredPitch = state.captureLagActive',
                '                ? CAPTURE_LAG_CLIMB_PITCH_DEG',
                '                : desiredPitchDegrees(leadDirection);',
                '        float z = (float) Mth.clamp(',
                '                (desiredPitch - snapshot.pitchDeg()) / CAPTURE_PITCH_DIVISOR',
                '                        - CAPTURE_PITCH_RATE_DAMPING * pitchRate,',
                '                -0.88, 0.88);',
                '        double targetAltitude = state.captureLagActive',
                '                ? Math.max(target.getBoundingBox().getCenter().y + 4.0,',
                '                state.startAltitude + 30.0)',
                '                : target.getBoundingBox().getCenter().y + 4.0;',
                '        double altitudeError = targetAltitude - snapshot.position().y;',
                '        double targetSpeed = Math.max(profile.cruiseSpeedBps(),',
                '                target.getDeltaMovement().horizontalDistance() * 20.0 + 3.0);',
                '        float engine = state.captureLagActive ? 1.0f',
                '                : snapshot.speedBps() < targetSpeed - 1.0 ? 1.0f',
                '                : snapshot.speedBps() > targetSpeed + 3.0 ? 0.30f : 0.65f;',
                '        FlightControlOutput output = new FlightControlOutput(x, 0.0f, z, engine,',
                '                leadDirection, targetAltitude, targetSpeed,',
                '                headingError, altitudeError, targetSpeed - snapshot.speedBps(),',
                '                snapshot.speedBps() < profile.stallGuardSpeedBps(), false,',
                '                "energy_coupled_capture",',
                '                state.captureLagActive',
                '                        ? "powered_same_turn_lag_climb"',
                '                        : "damped_vector_capture_after_climbing_turn");',
                '        applyAndLog(level, aircraft, snapshot, output, state,',
                '                rawAngle, leadAngle, closure, phase);',
                '    }'
        ].join('\n')

        String oldDescriptionTail = [
                '                + ":turn_sign=" + state.turnSign',
                '                + ":max_yaw_change=" + round(state.maxYawChangeDeg);'
        ].join('\n')
        String newDescriptionTail = [
                '                + ":turn_sign=" + state.turnSign',
                '                + ":max_yaw_change=" + round(state.maxYawChangeDeg)',
                '                + ":best_capture_horizontal_error="',
                '                + round(state.bestCaptureHorizontalError)',
                '                + ":last_capture_horizontal_error="',
                '                + round(state.lastCaptureHorizontalError)',
                '                + ":capture_saturation_ticks=" + state.captureSaturationTicks',
                '                + ":capture_lag_active=" + state.captureLagActive',
                '                + ":capture_lag_ticks=" + state.captureLagTicks',
                '                + ":capture_lag_start_closure="',
                '                + round(state.captureLagStartClosure)',
                '                + ":capture_lag_turn_input_sign="',
                '                + state.captureLagTurnInputSign;'
        ].join('\n')

        String oldStateFields = [
                '        private double lastYawDeg;',
                '        private double lastPitchDeg;',
                '        private int totalTicks;'
        ].join('\n')
        String newStateFields = [
                '        private double lastYawDeg;',
                '        private double lastPitchDeg;',
                '        private double bestCaptureHorizontalError = Double.POSITIVE_INFINITY;',
                '        private double lastCaptureHorizontalError = Double.NaN;',
                '        private double captureLagStartClosure;',
                '        private double captureLagTurnInputSign;',
                '        private int captureSaturationTicks;',
                '        private int captureLagTicks;',
                '        private boolean captureLagActive;',
                '        private int totalTicks;'
        ].join('\n')

        boolean fullyApplied = adapter.contains('CAPTURE_SATURATION_MAX_IMPROVEMENT_DEG')
                && adapter.contains('powered_same_turn_lag_climb')
                && adapter.contains('captureLagActive')
        if (fullyApplied) {
            logger.lifecycle('Coupled-climb powered lag-climb experiment already applied in this workspace.')
            return
        }

        int constantsCount = adapter.split(Pattern.quote(oldConstants), -1).length - 1
        int captureCount = adapter.split(Pattern.quote(oldCapture), -1).length - 1
        int applyCaptureCount = adapter.split(Pattern.quote(oldApplyCapture), -1).length - 1
        int descriptionCount = adapter.split(Pattern.quote(oldDescriptionTail), -1).length - 1
        int stateCount = adapter.split(Pattern.quote(oldStateFields), -1).length - 1
        if (constantsCount != 1 || captureCount != 1 || applyCaptureCount != 1
                || descriptionCount != 1 || stateCount != 1) {
            throw new GradleException('Refusing powered lag-climb experiment: '
                    + "constants=${constantsCount}, capture=${captureCount}, "
                    + "applyCapture=${applyCaptureCount}, description=${descriptionCount}, "
                    + "state=${stateCount}")
        }

        adapter = adapter.replace(oldConstants, newConstants)
                .replace(oldCapture, newCapture)
                .replace(oldApplyCapture, newApplyCapture)
                .replace(oldDescriptionTail, newDescriptionTail)
                .replace(oldStateFields, newStateFields)
        adapterSource.setText(adapter, 'UTF-8')
        logger.lifecycle('Applied CAPTURE powered same-turn lag-climb experiment.')
    }
}
