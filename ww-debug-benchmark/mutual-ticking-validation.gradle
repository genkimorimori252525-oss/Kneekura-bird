import java.util.regex.Pattern
import org.gradle.api.tasks.compile.JavaCompile

// GameTest harness integrity experiment: preserve the balanced opening angle while keeping the
// disposable P-47N inside the server's entity-ticking range from the primary aircraft.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        File source = file('src/main/java/com/wwdebug/autopilot/MutualDogfightOpeningAdapter.java')
        String text = source.getText('UTF-8').replace('\r\n', '\n')
        String oldPosition = [
                '        Vec3 opponentPosition = primary.position()',
                '                .add(forward.scale(150.0))',
                '                .add(right.scale(55.0))',
                '                .add(0.0, 8.0, 0.0);'
        ].join('\n')
        String newPosition = [
                '        Vec3 opponentPosition = primary.position()',
                '                .add(forward.scale(105.0))',
                '                .add(right.scale(35.0))',
                '                .add(0.0, 8.0, 0.0);'
        ].join('\n')

        if (text.contains(newPosition)) {
            logger.lifecycle('Mutual opponent ticking-range opening already applied.')
            return
        }
        int count = text.split(Pattern.quote(oldPosition), -1).length - 1
        if (count != 1) {
            throw new GradleException("Refusing mutual ticking-range experiment: matches=${count}")
        }
        source.setText(text.replace(oldPosition, newPosition), 'UTF-8')
        logger.lifecycle('Applied balanced mutual opening at approximately 111 blocks for immediate entity ticking.')
    }
}
