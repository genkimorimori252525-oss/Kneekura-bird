plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def gameTestRunDirectory = project.file('run-gametest')
def generatedGameTestResources = layout.buildDirectory.dir('generated/gametest-resources')

sourceSets.main.resources.srcDir(generatedGameTestResources)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                wwdebug_benchmark {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory gameTestRunDirectory
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'wwdebug.flightGameTestAircraft',
                    (project.findProperty('flightTestAircraft') ?: 'warfare_wings:a6m').toString()
        }
    }
}

mixin {
    add sourceSets.main, 'wwdebug_benchmark.refmap.json'
    config 'wwdebug_benchmark.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.register('generateEmptyGameTestStructure') {
    def output = generatedGameTestResources.map {
        it.file("data/${mod_id}/structures/empty.nbt").asFile
    }
    outputs.file(output)

    doLast {
        File target = output.get()
        target.parentFile.mkdirs()
        new java.io.DataOutputStream(new java.io.BufferedOutputStream(
                new java.io.FileOutputStream(target))).withCloseable { out ->
            out.writeByte(10)
            out.writeUTF('')

            out.writeByte(3)
            out.writeUTF('DataVersion')
            out.writeInt(3465)

            out.writeByte(9)
            out.writeUTF('size')
            out.writeByte(3)
            out.writeInt(3)
            out.writeInt(1)
            out.writeInt(1)
            out.writeInt(1)

            out.writeByte(9)
            out.writeUTF('palette')
            out.writeByte(10)
            out.writeInt(1)
            out.writeByte(8)
            out.writeUTF('Name')
            out.writeUTF('minecraft:air')
            out.writeByte(0)

            out.writeByte(9)
            out.writeUTF('blocks')
            out.writeByte(10)
            out.writeInt(0)

            out.writeByte(9)
            out.writeUTF('entities')
            out.writeByte(10)
            out.writeInt(0)

            out.writeByte(0)
        }
    }
}

tasks.register('prepareFlightGameTestRuntime') {
    group = 'verification'
    description = 'Stages runtime aircraft mods and optional measured profiles for runGameTestServer.'
    dependsOn tasks.named('generateEmptyGameTestStructure')

    doLast {
        gameTestRunDirectory.mkdirs()
        new File(gameTestRunDirectory, 'eula.txt').text = 'eula=true\n'

        File modsDirectory = new File(gameTestRunDirectory, 'mods')
        project.delete(modsDirectory)
        modsDirectory.mkdirs()

        List<File> runtimeJars = []
        File conventionalDirectory = project.file('flight-test-mods')
        if (conventionalDirectory.isDirectory()) {
            runtimeJars.addAll(project.fileTree(conventionalDirectory) { include '*.jar' }.files)
        }

        String environmentMods = System.getenv('WW_FLIGHT_TEST_MODS')
        if (environmentMods != null && !environmentMods.isBlank()) {
            environmentMods.split(java.util.regex.Pattern.quote(File.pathSeparator)).each { value ->
                File supplied = project.file(value)
                if (supplied.isDirectory()) {
                    runtimeJars.addAll(project.fileTree(supplied) { include '*.jar' }.files)
                } else if (supplied.isFile() && supplied.name.endsWith('.jar')) {
                    runtimeJars.add(supplied)
                }
            }
        }

        runtimeJars = runtimeJars.unique { it.canonicalPath }
        if (runtimeJars.isEmpty()) {
            throw new GradleException('No flight-test runtime jars found. Put Immersive Aircraft and Warfare Wings jars in ww-debug-benchmark/flight-test-mods, or set WW_FLIGHT_TEST_MODS.')
        }
        project.copy {
            from runtimeJars
            into modsDirectory
        }

        File profileDirectory = new File(gameTestRunDirectory, 'config/warfare_wings')
        File stagedProfile = new File(profileDirectory, 'flight_profiles.json')
        project.delete(stagedProfile)

        String profileValue = project.findProperty('flightProfiles')?.toString()
        if (profileValue == null || profileValue.isBlank()) {
            profileValue = System.getenv('WW_FLIGHT_PROFILES')
        }
        if (profileValue != null && !profileValue.isBlank()) {
            File profileFile = project.file(profileValue)
            if (!profileFile.isFile()) {
                throw new GradleException("Measured profile file does not exist: ${profileFile}")
            }
            profileDirectory.mkdirs()
            project.copy {
                from profileFile
                into profileDirectory
                rename { 'flight_profiles.json' }
            }
        } else {
            logger.lifecycle('No measured profile supplied; the headless GameTest will run the real fighter benchmark first.')
        }
    }
}

tasks.register('runFlightSimulation', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic autonomous-flight pre-flight simulator.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wwdebug.simulation.FlightSimulationMain'

    String profileValue = project.findProperty('flightProfiles')?.toString()
    if (profileValue == null || profileValue.isBlank()) {
        profileValue = System.getenv('WW_FLIGHT_PROFILES')
    }
    if (profileValue != null && !profileValue.isBlank()) {
        args '--profiles', profileValue
    }
    args '--output', layout.buildDirectory.file('reports/flight-simulation/report.json').get().asFile.absolutePath
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateEmptyGameTestStructure')
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('runFlightSimulation')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareFlightGameTestRuntime')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'Kamogawa private tooling',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Kamogawa private tooling',
                'MixinConfigs'            : 'wwdebug_benchmark.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
