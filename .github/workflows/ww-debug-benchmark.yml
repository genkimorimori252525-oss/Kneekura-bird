name: WW Debug Benchmark build

on:
  push:
    paths:
      - 'ww-debug-benchmark/**'
      - '.github/workflows/ww-debug-benchmark.yml'
  pull_request:
    paths:
      - 'ww-debug-benchmark/**'
      - '.github/workflows/ww-debug-benchmark.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ww-debug-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build benchmark mod
        run: gradle --no-daemon --console=plain --quiet build
      - uses: actions/upload-artifact@v4
        with:
          name: ww-debug-benchmark
          path: ww-debug-benchmark/build/libs/*.jar
