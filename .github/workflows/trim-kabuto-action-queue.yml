name: Trim Kabuto Action Queue

on:
  pull_request:
    paths:
      - '.github/workflows/trim-kabuto-action-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trim:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell

    steps:
      - name: Cancel final redundant Kabuto bootstrap
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'genkimorimori252525-oss/kabuto'
          $cancelId = 30121563199
          $keepId = 30121749597

          $cancel = ((& gh api "repos/$repo/actions/runs/$cancelId") -join [Environment]::NewLine) | ConvertFrom-Json
          Write-Host "Candidate before cancellation: id=$($cancel.id) name=$($cancel.name) event=$($cancel.event) status=$($cancel.status) head=$($cancel.head_sha)"
          if ($cancel.name -ne 'Forge 1.20.1 Bootstrap Validation') {
            throw "Run $cancelId is not the expected bootstrap validation."
          }
          if ($cancel.status -in @('queued','in_progress','pending','waiting')) {
            & gh api -X POST "repos/$repo/actions/runs/$cancelId/cancel" --silent
            if ($LASTEXITCODE -ne 0) { throw "Could not cancel run $cancelId" }
            Write-Host "Cancellation requested for redundant bootstrap run $cancelId"
          }

          $keep = ((& gh api "repos/$repo/actions/runs/$keepId") -join [Environment]::NewLine) | ConvertFrom-Json
          Write-Host "Kept probe: id=$($keep.id) name=$($keep.name) event=$($keep.event) status=$($keep.status) head=$($keep.head_sha)"
          if ($keep.name -ne 'Forge 1.20.1 Port Compile Probe' -or $keep.event -ne 'pull_request') {
            throw "Run $keepId is not the intended latest PR probe."
          }
