name: Trim Kabuto Action Queue

on:
  pull_request:
    paths:
      - '.github/workflows/trim-kabuto-action-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trim:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell

    steps:
      - name: Cancel stale Kabuto push probe
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'genkimorimori252525-oss/kabuto'
          $staleId = 30107559827

          $stale = ((& gh api "repos/$repo/actions/runs/$staleId") -join [Environment]::NewLine) | ConvertFrom-Json
          Write-Host "Stale run before cancellation: id=$($stale.id) name=$($stale.name) event=$($stale.event) status=$($stale.status) head=$($stale.head_sha)"
          if ($stale.status -in @('queued','in_progress','pending','waiting')) {
            & gh api -X POST "repos/$repo/actions/runs/$staleId/cancel" --silent
            if ($LASTEXITCODE -ne 0) { throw "Could not cancel stale run $staleId" }
            Write-Host "Cancellation requested for stale run $staleId"
          }

          foreach ($keepId in @(30107964067, 30107964533)) {
            $keep = ((& gh api "repos/$repo/actions/runs/$keepId") -join [Environment]::NewLine) | ConvertFrom-Json
            Write-Host "Kept current run: id=$($keep.id) name=$($keep.name) event=$($keep.event) status=$($keep.status) head=$($keep.head_sha)"
            if ($keep.event -ne 'pull_request') { throw "Run $keepId is not a PR validation run." }
          }
