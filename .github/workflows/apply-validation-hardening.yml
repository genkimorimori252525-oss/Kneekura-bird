name: Apply benchmark validation hardening

on:
  push:
    branches:
      - agent/harden-benchmark-from-validation
    paths:
      - 'tools/apply_validation_hardening.py'
      - '.github/workflows/apply-validation-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-benchmark-from-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted source patch
        run: python tools/apply_validation_hardening.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ww-debug-benchmark/src/main/java/com/wwdebug/benchmark/BenchmarkManager.java \
                  ww-debug-benchmark/src/main/java/com/wwdebug/benchmark/ReflectiveAircraft.java
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'fix: harden benchmark using in-game validation data'
            git push origin HEAD:agent/harden-benchmark-from-validation
          fi
