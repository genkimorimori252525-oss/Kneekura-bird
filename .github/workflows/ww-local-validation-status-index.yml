name: WW Local Validation Status Index

on:
  workflow_run:
    workflows: ["WW Local Windows Self-Hosted Validation"]
    types: [completed]

permissions:
  contents: write

jobs:
  index:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Persist latest validation status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const path = '.github/local-validation-status.json';
            const payload = {
              run_id: run.id,
              run_attempt: run.run_attempt,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_branch: run.head_branch,
              head_sha: run.head_sha,
              url: run.html_url,
              updated_at: new Date().toISOString(),
            };
            const content = Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(existing.data)) {
                sha = existing.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Record local validation run ${run.id}`,
              content,
              ...(sha ? { sha } : {}),
            });
