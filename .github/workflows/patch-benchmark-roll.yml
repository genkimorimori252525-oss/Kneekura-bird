name: Patch benchmark roll reset

on:
  push:
    branches:
      - agent/add-fixed-input-benchmark
    paths:
      - '.github/workflows/patch-benchmark-roll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-fixed-input-benchmark
      - name: Patch source and remove one-time workflow
        shell: python
        run: |
          from pathlib import Path

          source = Path('ww-debug-benchmark/src/main/java/com/wwdebug/benchmark/BenchmarkManager.java')
          text = source.read_text(encoding='utf-8')
          old = '            aircraft.setZRot(0.0f);'
          new = '            ReflectiveAircraft.setRoll(aircraft, 0.0f);'
          if old not in text:
              raise SystemExit('Expected roll-reset line was not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-benchmark-roll.yml').unlink()
      - name: Commit targeted patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ww-debug-benchmark/src/main/java/com/wwdebug/benchmark/BenchmarkManager.java .github/workflows/patch-benchmark-roll.yml
          git commit -m 'Reset benchmark roll reflectively'
          git push origin HEAD:agent/add-fixed-input-benchmark
