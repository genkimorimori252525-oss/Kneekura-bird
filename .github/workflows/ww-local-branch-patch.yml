name: WW Local Branch Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/local-branch-patch-request.txt'

permissions:
  contents: write

concurrency:
  group: ww-local-branch-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout request metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve safe request
        id: request
        run: |
          $requestPath = Join-Path $env:GITHUB_WORKSPACE '.github\local-branch-patch-request.txt'
          $values = @{}
          foreach ($line in Get-Content $requestPath) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#')) { continue }
            if ($trimmed -notmatch '^([a-z_]+)=(.+)$') { throw "Invalid request line: $trimmed" }
            $values[$Matches[1]] = $Matches[2].Trim()
          }

          $branch = $values['branch']
          $patch = $values['patch']
          $message = $values['message']
          if ($branch -notmatch '^agent/[A-Za-z0-9._/-]+$') { throw "Unsafe branch: $branch" }
          if ($patch -notmatch '^\.github/[A-Za-z0-9._/-]+\.patch$') { throw "Unsafe patch path: $patch" }
          if (-not $message -or $message.Length -gt 100) { throw 'Invalid commit message' }

          "branch=$branch" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT
          "message=$message" >> $env:GITHUB_OUTPUT

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.branch }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Validate, apply and commit patch
        env:
          PATCH_PATH: ${{ steps.request.outputs.patch }}
          COMMIT_MESSAGE: ${{ steps.request.outputs.message }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          git apply --check $env:PATCH_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $env:PATCH_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item $env:PATCH_PATH
          if (Test-Path '.github\level-bomber-apply-request.txt') {
            Remove-Item '.github\level-bomber-apply-request.txt'
          }
          if (Test-Path '.github\workflows\ww-apply-level-bomber-patch.yml') {
            Remove-Item '.github\workflows\ww-apply-level-bomber-patch.yml'
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$env:COMMIT_MESSAGE"
          git push origin "HEAD:$env:TARGET_BRANCH"
