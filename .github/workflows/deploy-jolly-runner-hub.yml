name: Inspect Local JollyRunnerHub Storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jolly-runner-hub-local-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect installed files and bounded storage candidates
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = Join-Path $env:LOCALAPPDATA 'JollyRunnerHub'
          $desktopExe = Join-Path ([Environment]::GetFolderPath('Desktop')) 'JollyRunnerHub.exe'
          $oneDriveDesktopExe = Join-Path $env:USERPROFILE 'OneDrive\Desktop\JollyRunnerHub.exe'
          $exe = @($desktopExe,$oneDriveDesktopExe) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          $outDir = Join-Path $env:RUNNER_TEMP "jollyhub-inspect-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          function Get-DirBytes([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Container)) { return 0 }
            $sum = (Get-ChildItem -LiteralPath $Path -File -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $sum) { return 0 }
            return [int64]$sum
          }

          $topFiles = @()
          if (Test-Path -LiteralPath $appRoot -PathType Container) {
            $topFiles = @(Get-ChildItem -LiteralPath $appRoot -File -Recurse -Force -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 40 |
              ForEach-Object {
                [pscustomobject]@{
                  relative = $_.FullName.Substring($appRoot.Length).TrimStart('\')
                  bytes = [int64]$_.Length
                  lastWriteUtc = $_.LastWriteTimeUtc.ToString('o')
                }
              })
          }

          $subdirs = @()
          if (Test-Path -LiteralPath $appRoot -PathType Container) {
            $subdirs = @(Get-ChildItem -LiteralPath $appRoot -Directory -Force -ErrorAction SilentlyContinue |
              ForEach-Object {
                [pscustomobject]@{ name=$_.Name; bytes=(Get-DirBytes $_.FullName) }
              } | Sort-Object bytes -Descending)
          }

          $historyFiles = @()
          $historyRoot = Join-Path $appRoot 'history'
          if (Test-Path -LiteralPath $historyRoot -PathType Container) {
            $historyFiles = @(Get-ChildItem -LiteralPath $historyRoot -File -Recurse -Filter '*.jsonl' -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 30 |
              ForEach-Object { [pscustomobject]@{ relative=$_.FullName.Substring($historyRoot.Length).TrimStart('\'); bytes=[int64]$_.Length; lastWriteUtc=$_.LastWriteTimeUtc.ToString('o') } })
          }

          $logFiles = @()
          $logsRoot = Join-Path $appRoot 'logs'
          if (Test-Path -LiteralPath $logsRoot -PathType Container) {
            $logFiles = @(Get-ChildItem -LiteralPath $logsRoot -File -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              ForEach-Object { [pscustomobject]@{ name=$_.Name; bytes=[int64]$_.Length; lastWriteUtc=$_.LastWriteTimeUtc.ToString('o') } })
          }

          $exeInfo = $null
          if ($exe) {
            $item = Get-Item -LiteralPath $exe
            $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            $exeInfo = [pscustomobject]@{
              path=$exe
              bytes=[int64]$item.Length
              sha256=$hash
              fileVersion=[string]$item.VersionInfo.FileVersion
              productVersion=[string]$item.VersionInfo.ProductVersion
              signatureStatus=[string]$sig.Status
              lastWriteUtc=$item.LastWriteTimeUtc.ToString('o')
            }
          }

          $sourceInfo = $null
          $installedScript = Join-Path $appRoot 'JollyRunnerHub.ps1'
          if (Test-Path -LiteralPath $installedScript -PathType Leaf) {
            $item = Get-Item -LiteralPath $installedScript
            $sourceInfo = [pscustomobject]@{
              bytes=[int64]$item.Length
              sha256=(Get-FileHash -LiteralPath $installedScript -Algorithm SHA256).Hash
              lastWriteUtc=$item.LastWriteTimeUtc.ToString('o')
            }
          }

          $proc = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { [string]$_.CommandLine -like '*JollyRunnerHub.bootstrap.ps1*' } |
            Select-Object ProcessId,CreationDate,CommandLine)

          $report = [ordered]@{
            generatedAt=(Get-Date).ToUniversalTime().ToString('o')
            appRoot=$appRoot
            appRootExists=(Test-Path -LiteralPath $appRoot -PathType Container)
            appRootBytes=(Get-DirBytes $appRoot)
            exe=$exeInfo
            installedScript=$sourceInfo
            activeBootstrapProcesses=$proc
            subdirs=$subdirs
            topFiles=$topFiles
            historyTop=$historyFiles
            logs=$logFiles
            dispatchRecovery = if (Test-Path -LiteralPath (Join-Path $appRoot 'dispatch-recovery.jsonl')) { [int64](Get-Item -LiteralPath (Join-Path $appRoot 'dispatch-recovery.jsonl')).Length } else { 0 }
            runtimeScriptBytes = if (Test-Path -LiteralPath (Join-Path $appRoot 'JollyRunnerHub.runtime.ps1')) { [int64](Get-Item -LiteralPath (Join-Path $appRoot 'JollyRunnerHub.runtime.ps1')).Length } else { 0 }
            startupErrorBytes = if (Test-Path -LiteralPath (Join-Path $appRoot 'startup-error.log')) { [int64](Get-Item -LiteralPath (Join-Path $appRoot 'startup-error.log')).Length } else { 0 }
          }
          $reportPath = Join-Path $outDir 'jollyhub-local-inspect.json'
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $reportPath -Encoding UTF8
          Get-Content -LiteralPath $reportPath -Raw

      - name: Upload inspection report
        uses: actions/upload-artifact@v6
        with:
          name: jollyhub-local-inspect-${{ github.run_id }}
          path: ${{ runner.temp }}/jollyhub-inspect-${{ github.run_id }}/jollyhub-local-inspect.json
          if-no-files-found: error