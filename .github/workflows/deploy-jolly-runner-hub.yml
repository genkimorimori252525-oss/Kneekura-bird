name: Patch Jolly Workspace Screenshot Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okayama-workspace-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell

    steps:
      - name: Patch exact Workspace production head
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '5133059c3c27e25e95bca421c99d7c6b889d77a2'
          $target = Join-Path $env:RUNNER_TEMP "okayama-workspace-patch-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue }
          gh repo clone genkimorimori252525-oss/Okayama-NAMASUTE-Club $target -- --no-checkout
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone private Workspace repository.' }
          Set-Location $target
          git fetch origin jolly/workspace-production-v1 --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch Workspace production branch.' }
          git checkout -B jolly/workspace-production-v1 origin/jolly/workspace-production-v1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout Workspace production branch.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected production head: $actual" }

          $file = Join-Path $target 'workspace\production\tests\windows-soak.js'
          $text = Get-Content -LiteralPath $file -Raw
          $oldCleanup = '  fs.rmSync(profile, {recursive:true, force:true, maxRetries:50, retryDelay:100});'
          $newCleanup = @'
          let cleanupWarning = null;
          try {
            fs.rmSync(profile, {recursive:true, force:true, maxRetries:50, retryDelay:100});
          } catch (error) {
            cleanupWarning = String(error && (error.code || error.message) || error);
          }
          '@.TrimEnd()
          if (-not $text.Contains($oldCleanup)) { throw 'Expected Chrome cleanup statement not found.' }
          $text = $text.Replace($oldCleanup, $newCleanup)

          $oldReturn = '  return {captured:true, path:target, bytes:fs.statSync(target).size};'
          $newReturn = '  return {captured:true, path:target, bytes:fs.statSync(target).size, ...(cleanupWarning ? {profileCleanupWarning:cleanupWarning} : {})};'
          if (-not $text.Contains($oldReturn)) { throw 'Expected screenshot success return not found.' }
          $text = $text.Replace($oldReturn, $newReturn)
          Set-Content -LiteralPath $file -Value $text -Encoding UTF8

          node --check workspace/production/tests/windows-soak.js
          if ($LASTEXITCODE -ne 0) { throw 'Patched soak file failed syntax validation.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed after cleanup patch.' }

          git config user.name 'Jolly Workspace Bot'
          git config user.email 'jolly-workspace@users.noreply.github.com'
          git add -- workspace/production/tests/windows-soak.js
          if ((git diff --cached --name-only).Trim() -ne 'workspace/production/tests/windows-soak.js') { throw 'Unexpected staged files.' }
          git commit -m 'test: make Chrome profile cleanup nonfatal on Windows'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit cleanup patch.' }
          git push origin HEAD:jolly/workspace-production-v1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push cleanup patch.' }
          git rev-parse HEAD

      - name: Clean temporary checkout
        if: always()
        run: |
          Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'okayama-workspace-patch-*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue