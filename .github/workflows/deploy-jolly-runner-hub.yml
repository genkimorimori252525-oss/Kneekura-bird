name: Patch Jolly Workspace Browser Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okayama-workspace-browser-bridge-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: jolly/okayama-workspace-soak-20260904
          fetch-depth: 1

      - name: Verify tools
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          git --version
          gh --version
          gh auth status

      - name: Clone exact production branch
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP "okayama-bridge-patch-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          gh repo clone genkimorimori252525-oss/Okayama-NAMASUTE-Club $target -- --no-checkout
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Set-Location $target
          git config core.autocrlf false
          git fetch origin jolly/workspace-production-v1 --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          git checkout -B jolly/workspace-production-v1 b065ddda595fcdb610ffb1d579a55900aee2e057
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          git reset --hard b065ddda595fcdb610ffb1d579a55900aee2e057
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne 'b065ddda595fcdb610ffb1d579a55900aee2e057') { throw "unexpected head $actual" }
          "OKAYAMA_PATCH_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply bounded plugin patch
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/jolly-workspace/browser-bridge-patch.js $env:OKAYAMA_PATCH_PATH
          if ($LASTEXITCODE -ne 0) { throw 'patch script failed' }
          Copy-Item -LiteralPath tools/jolly-workspace/browser-bridge.test.js -Destination (Join-Path $env:OKAYAMA_PATCH_PATH 'workspace\production\tests\browser-bridge.test.js') -Force

      - name: Run plugin regression suite
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:OKAYAMA_PATCH_PATH
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'npm run check failed' }

      - name: Commit and push exact production branch
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:OKAYAMA_PATCH_PATH
          git config user.name "Jolly Workspace Bot"
          git config user.email "jolly-workspace@users.noreply.github.com"
          git add companion/browser/manifest.json companion/browser/background.js companion/browser/production-bridge.js workspace/production/src/server.js workspace/production/src/launcher.js workspace/production/web/production.js workspace/production/tests/browser-bridge.test.js
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -ne 7) { $changed; throw "unexpected patch file count: $($changed.Count)" }
          git commit -m "feat: pair Browser Companion with production workspace"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:jolly/workspace-production-v1
          if ($LASTEXITCODE -ne 0) { throw 'push failed; production head may have advanced' }
          git rev-parse HEAD

      - name: Clean checkout
        if: always()
        run: |
          if ($env:OKAYAMA_PATCH_PATH -and (Test-Path -LiteralPath $env:OKAYAMA_PATCH_PATH)) { Remove-Item -LiteralPath $env:OKAYAMA_PATCH_PATH -Recurse -Force -ErrorAction SilentlyContinue }