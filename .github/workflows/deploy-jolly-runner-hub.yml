name: Chunk Jolly Workspace Final Visual Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chunk-evidence:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout disposable helper branch
        uses: actions/checkout@v4
        with:
          ref: jolly/okayama-workspace-soak-20260904
          fetch-depth: 1
          persist-credentials: false
      - name: Encode final PNG into bounded text chunks
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/jolly-workspace/chunk-final-proof.js
          if ($LASTEXITCODE -ne 0) { throw 'Chunking failed.' }
          Get-Content tools/jolly-workspace/final-evidence/png-base64/meta.json -Raw
      - name: Publish chunks only to disposable helper branch
        run: |
          $ErrorActionPreference = 'Stop'
          gh auth status
          gh auth setup-git
          git config user.name "Jolly Workspace Evidence"
          git config user.email "jolly-workspace@users.noreply.github.com"
          git add tools/jolly-workspace/final-evidence/png-base64
          git commit -m "test: encode final Command Deck proof for inspection"
          if ($LASTEXITCODE -ne 0) { throw 'Chunk commit failed.' }
          git push origin HEAD:jolly/okayama-workspace-soak-20260904
          if ($LASTEXITCODE -ne 0) { throw 'Chunk push failed.' }