name: Validate Jolly Workspace Production Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okayama-workspace-windows-soak
  cancel-in-progress: false

jobs:
  windows-soak:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout validation helper
        uses: actions/checkout@v4
        with:
          ref: jolly/okayama-workspace-soak-20260904
          fetch-depth: 1

      - name: Verify local Windows runner prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node is unavailable.' }
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is unavailable.' }
          gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI is unavailable.' }
          gh auth status
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI user authentication is unavailable.' }

      - name: Clone exact Workspace candidate with local user authentication
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP "okayama-workspace-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          gh repo clone genkimorimori252525-oss/Okayama-NAMASUTE-Club $target -- --no-checkout
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone private Workspace repository.' }
          Set-Location $target
          git config core.autocrlf false
          git fetch origin jolly/workspace-production-v1 --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch Workspace production branch.' }
          git checkout --detach f89028f82cb9ebb95f8fda76df95151a8eb43d11
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout exact Workspace production commit.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne 'f89028f82cb9ebb95f8fda76df95151a8eb43d11') { throw "Unexpected head: $actual" }
          "OKAYAMA_WORKSPACE_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Validated exact candidate $actual"

      - name: Run complete Node test suite
        run: |
          Set-Location $env:OKAYAMA_WORKSPACE_PATH
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed.' }

      - name: Run JavaScript syntax checks
        run: |
          Set-Location $env:OKAYAMA_WORKSPACE_PATH
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'npm run check failed.' }

      - name: Run real Windows integration and unattended soak
        env:
          JOLLY_SOAK_SECONDS: '60'
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build\okayama-windows-soak'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $env:JOLLY_SOAK_OUTPUT = $evidence
          $shim = Join-Path $env:GITHUB_WORKSPACE 'tools\jolly-workspace\chrome-screenshot-shim.js'
          $env:NODE_OPTIONS = "--require=$shim"
          Set-Location $env:OKAYAMA_WORKSPACE_PATH
          npm run workspace:soak:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows Workspace soak failed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $evidence 'windows-soak-report.json'))) { throw 'Soak report was not produced.' }
          Get-Content -LiteralPath (Join-Path $evidence 'windows-soak-report.json') -Raw

      - name: Run live Browser Companion bridge and rendered reconnect proof
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build\okayama-windows-soak'
          $shim = Join-Path $env:GITHUB_WORKSPACE 'tools\jolly-workspace\chrome-screenshot-shim.js'
          $env:NODE_OPTIONS = "--require=$shim"
          Set-Location $env:GITHUB_WORKSPACE
          node tools/jolly-workspace/final-browser-bridge-proof.js $env:OKAYAMA_WORKSPACE_PATH $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Browser Companion live proof failed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $evidence 'browser-bridge-proof.json'))) { throw 'Browser Companion proof report was not produced.' }
          Get-Content -LiteralPath (Join-Path $evidence 'browser-bridge-proof.json') -Raw

      - name: Upload Windows soak evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: okayama-workspace-windows-soak-${{ github.run_id }}
          if-no-files-found: warn
          path: build/okayama-windows-soak/**

      - name: Clean temporary Workspace checkout
        if: always()
        run: |
          if ($env:OKAYAMA_WORKSPACE_PATH -and (Test-Path -LiteralPath $env:OKAYAMA_WORKSPACE_PATH)) {
            Remove-Item -LiteralPath $env:OKAYAMA_WORKSPACE_PATH -Recurse -Force -ErrorAction SilentlyContinue
          }