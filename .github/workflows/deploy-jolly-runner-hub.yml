name: Deploy Jolly Runner Hub

on:
  push:
    branches: [main]
    paths:
      - 'tools/JollyRunnerHub/**'
      - '.github/workflows/deploy-jolly-runner-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Build and install desktop app
        run: |
          .\tools\JollyRunnerHub\Build-Deploy.ps1 -Install

      - name: Upload portable launcher
        uses: actions/upload-artifact@v4
        with:
          name: JollyRunnerHub-${{ github.run_id }}
          path: |
            tools/JollyRunnerHub/build/JollyRunnerHub.exe
            tools/JollyRunnerHub/JollyRunnerHub.ps1
            tools/JollyRunnerHub/profiles.default.json
            tools/JollyRunnerHub/README.md

      - name: Persist deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          SELF_HOSTED_RUNNER: ${{ runner.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/jolly-runner-hub-status.json';
            const payload = {
              run_id: context.runId,
              status: process.env.JOB_STATUS,
              head_sha: context.sha,
              runner: process.env.SELF_HOSTED_RUNNER,
              installed_executable: 'Desktop/JollyRunnerHub.exe',
              updated_at: new Date().toISOString(),
            };
            const content = Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Record Jolly Runner Hub deployment ${context.runId}`,
              content,
              ...(sha ? { sha } : {}),
            });
