name: WW Local Windows Route Validation

on:
  push:
    paths:
      - '.github/local-route-validation-request.txt'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Repository branch, tag, or commit to validate'
        required: true
        default: 'main'
        type: string
      aircraft:
        description: 'Aircraft entity id'
        required: true
        default: 'warfare_wings:p51d'
        type: string

permissions:
  contents: write

concurrency:
  group: ww-selfhosted-physics
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'genkimorimori252525-oss')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout route request metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve route validation request
        id: request
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_AIRCRAFT: ${{ inputs.aircraft }}
        run: |
          $ref = 'main'
          $aircraft = 'warfare_wings:p51d'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:DISPATCH_REF) { $ref = $env:DISPATCH_REF.Trim() }
            if ($env:DISPATCH_AIRCRAFT) { $aircraft = $env:DISPATCH_AIRCRAFT.Trim() }
          }
          else {
            $requestPath = Join-Path $env:GITHUB_WORKSPACE '.github\local-route-validation-request.txt'
            if (-not (Test-Path $requestPath)) {
              throw "Missing route validation request: $requestPath"
            }
            $values = @{}
            foreach ($line in Get-Content $requestPath) {
              $trimmed = $line.Trim()
              if (-not $trimmed -or $trimmed.StartsWith('#')) { continue }
              if ($trimmed -notmatch '^([a-z_]+)=(.+)$') {
                throw "Invalid route request line: $trimmed"
              }
              $values[$Matches[1]] = $Matches[2].Trim()
            }
            if ($values.ContainsKey('ref')) { $ref = $values['ref'] }
            if ($values.ContainsKey('aircraft')) { $aircraft = $values['aircraft'] }
          }
          if ($ref -notmatch '^[A-Za-z0-9._/-]+$') { throw "Unsafe repository ref: $ref" }
          if ($aircraft -notmatch '^[a-z0-9_.-]+:[a-z0-9_./-]+$') {
            throw "Unsafe aircraft id: $aircraft"
          }
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "aircraft=$aircraft" >> $env:GITHUB_OUTPUT
          "FLIGHT_TEST_TARGET=$aircraft" >> $env:GITHUB_ENV
          Write-Host "Route validation ref: $ref"
          Write-Host "Aircraft: $aircraft"

      - name: Persist route validation start
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/local-route-validation-status.json';
            const branch = context.ref.replace('refs/heads/', '');
            const payload = {
              run_id: context.runId,
              status: 'in_progress',
              conclusion: null,
              event: context.eventName,
              branch,
              event_sha: context.sha,
              requested_ref: process.env.REQUEST_REF,
              aircraft: process.env.REQUEST_AIRCRAFT,
              scenario: 'route',
              updated_at: new Date().toISOString(),
            };
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path, ref: branch,
              });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path, branch,
              message: `Record route validation start ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {}),
            });

      - name: Checkout requested behavior revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve checked-out commit
        id: checked_out
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid checked-out SHA: $sha" }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Checked-out behavior commit: $sha"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build benchmark mod and deterministic simulation
        id: build
        continue-on-error: true
        timeout-minutes: 30
        working-directory: ww-debug-benchmark
        run: |
          cmd /d /s /c "gradle --no-daemon --console=plain build > build.log 2>&1"
          $status = $LASTEXITCODE

          # ForgeGradle contacts maven.minecraftforge.net during plugin application. A dropped
          # TLS handshake there fails the build in ~20 s with no bearing on the aircraft under
          # test; run 30175598909 (fw190) was lost exactly this way while the same behaviour ref
          # had passed minutes earlier. Retry once, and only for the transient signatures.
          if ($status -ne 0 -and (Test-Path build.log)) {
            $pattern = 'SSLHandshakeException|SSL peer shut down incorrectly|Failed to validate certificate for host|SocketTimeoutException|Connection reset|UnknownHostException|Remote host terminated the handshake'
            if (Select-String -Path build.log -Pattern $pattern -Quiet) {
              Write-Output 'Retrying build once after a transient network failure reaching the Forge maven host.'
              Move-Item build.log build-first-attempt.log -Force
              cmd /d /s /c "gradle --no-daemon --console=plain build > build.log 2>&1"
              $status = $LASTEXITCODE
            }
          }

          if (Test-Path build.log) { Get-Content build.log -Tail 240 }
          exit $status

      - name: Download exact runtime aircraft mods
        if: steps.build.outcome == 'success'
        working-directory: ww-debug-benchmark
        run: |
          New-Item -ItemType Directory -Force flight-test-mods | Out-Null
          @'
          import json
          import pathlib
          import urllib.request

          versions = {
              "GsVmbbkj": "immersive_aircraft-1.3.3+1.20.1-forge.jar",
              "q94LN7dV": "warfare_wings-1.1.4-1.20.1-forge.jar",
          }
          target = pathlib.Path("flight-test-mods")
          for version_id, required_name in versions.items():
              destination = target / required_name
              if destination.is_file() and destination.stat().st_size > 0:
                  print(f"using cached {destination} ({destination.stat().st_size} bytes)")
                  continue
              request = urllib.request.Request(
                  f"https://api.modrinth.com/v2/version/{version_id}",
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(request) as response:
                  metadata = json.load(response)
              files = metadata.get("files", [])
              if not files:
                  raise RuntimeError(f"Modrinth version {version_id} returned no files")
              selected = next((item for item in files if item.get("primary")), files[0])
              download = urllib.request.Request(
                  selected["url"],
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(download) as response, destination.open("wb") as output:
                  output.write(response.read())
              print(f"downloaded {destination} ({destination.stat().st_size} bytes)")
          '@ | python -

      - name: Run and verify exact-physics route scenario
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: ww-debug-benchmark
        run: |
          cmd /d /s /c "gradle --no-daemon --console=plain runGameTestServer -PflightTestAircraft=%FLIGHT_TEST_TARGET% -PflightTestScenario=route > headless-route.log 2>&1"
          $gradleStatus = $LASTEXITCODE
          if (Test-Path headless-route.log) { Get-Content headless-route.log -Tail 320 }
          python tools/verify_flight_scenario.py --root run-gametest --scenario full --gradle-status $gradleStatus --output run-gametest/scenario-verification-route.json

      - name: Upload route diagnostics
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ww-local-route-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ww-debug-benchmark/build.log
            ww-debug-benchmark/build/reports/flight-simulation/report.json
            ww-debug-benchmark/headless-route.log
            ww-debug-benchmark/run-gametest/**/wwdebug/**
            ww-debug-benchmark/run-gametest/logs/**
            ww-debug-benchmark/run-gametest/crash-reports/**
            ww-debug-benchmark/run-gametest/config/warfare_wings/flight_profiles.json
            ww-debug-benchmark/run-gametest/scenario-verification-route.json

      - name: Persist route validation finish
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_SHA: ${{ steps.checked_out.outputs.sha }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/local-route-validation-status.json';
            const branch = context.ref.replace('refs/heads/', '');
            const success = process.env.BUILD_OUTCOME === 'success'
              && process.env.GAMETEST_OUTCOME === 'success';
            const payload = {
              run_id: context.runId,
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              event: context.eventName,
              branch,
              event_sha: context.sha,
              requested_ref: process.env.REQUEST_REF || null,
              requested_sha: process.env.REQUEST_SHA || null,
              aircraft: process.env.REQUEST_AIRCRAFT || null,
              scenario: 'route',
              build_outcome: process.env.BUILD_OUTCOME || null,
              gametest_outcome: process.env.GAMETEST_OUTCOME || null,
              artifact_outcome: process.env.UPLOAD_OUTCOME || null,
              updated_at: new Date().toISOString(),
            };
            const content = Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64');
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt++) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path, ref: branch,
                });
                if (!Array.isArray(existing.data)) sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner, repo: context.repo.repo, path, branch,
                  message: `Record route validation finish ${context.runId}`,
                  content,
                  ...(sha ? { sha } : {}),
                });
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
                if (![409, 422].includes(error.status) || attempt === 4) throw error;
                core.warning(`Route status update conflicted on attempt ${attempt}; retrying`);
                await new Promise(resolve => setTimeout(resolve, attempt * 1500));
              }
            }
            if (lastError) throw lastError;

      - name: Fail after preserving route diagnostics
        if: steps.build.outcome == 'failure' || steps.gametest.outcome == 'failure'
        run: exit 1
