name: Bootstrap Kabuto Self-Hosted Runner

on:
  pull_request:
    paths:
      - '.github/workflows/bootstrap-kabuto-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-kabuto-runner
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: Inspect host and bootstrap Kabuto runner when authorized
        id: bootstrap
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'kabuto-runner-bootstrap.txt'
          $sourceRoot = 'C:\actions-runner'
          $targetRoot = 'C:\actions-runner-kabuto'
          $runnerVersion = '2.336.0'
          $repo = 'genkimorimori252525-oss/kabuto'
          $repoUrl = "https://github.com/$repo"

          $lines = New-Object System.Collections.Generic.List[string]
          function Record([string]$Text) {
            $lines.Add($Text)
            Write-Host $Text
          }

          $failure = $null
          try {
            Record "timestamp=$([DateTime]::UtcNow.ToString('o'))"
            Record "runner_name=$env:RUNNER_NAME"
            Record "source_runner_present=$(Test-Path (Join-Path $sourceRoot 'run.cmd'))"
            Record "target_runner_present=$(Test-Path (Join-Path $targetRoot 'run.cmd'))"
            Record "target_runner_version=$runnerVersion"

            $gh = Get-Command gh -ErrorAction SilentlyContinue
            Record "gh_installed=$($null -ne $gh)"
            if ($null -eq $gh) {
              throw 'GitHub CLI is not installed on the self-hosted runner.'
            }

            & gh auth status *> $null
            $authenticated = $LASTEXITCODE -eq 0
            Record "gh_authenticated=$authenticated"
            if (-not $authenticated) {
              throw 'GitHub CLI exists but has no authenticated user session.'
            }

            & gh api "repos/$repo" --silent
            $repoAccess = $LASTEXITCODE -eq 0
            Record "kabuto_repo_access=$repoAccess"
            if (-not $repoAccess) {
              throw 'The host GitHub CLI session cannot access the Kabuto repository.'
            }

            $token = (& gh api -X POST "repos/$repo/actions/runners/registration-token" --jq '.token').Trim()
            if (-not $token) {
              throw 'GitHub did not return a Kabuto runner registration token.'
            }
            Record 'registration_token_acquired=true'

            $runnerConfig = Join-Path $targetRoot '.runner'
            $runnerCredentials = Join-Path $targetRoot '.credentials'
            $fullyConfigured = (Test-Path $runnerConfig) -and (Test-Path $runnerCredentials)

            if (-not $fullyConfigured) {
              $escaped = [regex]::Escape($targetRoot)
              foreach ($process in @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" |
                Where-Object {
                  ([string]$_.ExecutablePath -match "^$escaped") -or
                  ([string]$_.CommandLine -match $escaped)
                })) {
                Start-Process taskkill.exe -ArgumentList '/PID',[string]$process.ProcessId,'/T','/F' -Wait -WindowStyle Hidden | Out-Null
              }

              Remove-Item -Recurse -Force $targetRoot -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null

              $runnerZip = Join-Path $env:RUNNER_TEMP "actions-runner-win-x64-$runnerVersion.zip"
              $runnerUrl = "https://github.com/actions/runner/releases/download/v$runnerVersion/actions-runner-win-x64-$runnerVersion.zip"
              Invoke-WebRequest -UseBasicParsing -Uri $runnerUrl -OutFile $runnerZip
              Expand-Archive -Path $runnerZip -DestinationPath $targetRoot -Force
              Record 'runner_distribution_downloaded=true'

              $configLogRoot = Join-Path $targetRoot '_diag'
              New-Item -ItemType Directory -Force -Path $configLogRoot | Out-Null
              $configLog = Join-Path $configLogRoot 'kabuto-config.log'
              Push-Location $targetRoot
              try {
                $configOutput = @(& .\config.cmd --unattended --url $repoUrl --token $token --name 'Jolly-Kabuto' --work '_work' --labels 'kabuto,forge-1.20.1' --replace 2>&1)
                $configStatus = $LASTEXITCODE
                $configOutput | Set-Content -Encoding UTF8 $configLog
                foreach ($entry in ($configOutput | Select-Object -Last 40)) {
                  $safeEntry = ([string]$entry).Replace($token, '***') -replace '[\r\n]+', ' '
                  Record "config_output=$safeEntry"
                }
                Record "config_exit_code=$configStatus"
                if ($configStatus -ne 0) {
                  throw "config.cmd failed with exit code $configStatus"
                }
              }
              finally {
                Pop-Location
              }
              Record 'runner_registered=true'
            }
            else {
              Record 'runner_registered=already'
            }

            $escaped = [regex]::Escape($targetRoot)
            $running = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" |
              Where-Object {
                ([string]$_.ExecutablePath -match "^$escaped") -or
                ([string]$_.CommandLine -match $escaped)
              }).Count -gt 0

            if (-not $running) {
              $logRoot = Join-Path $targetRoot '_diag'
              New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
              $log = Join-Path $logRoot 'jolly-kabuto-launch.log'
              $runCmd = Join-Path $targetRoot 'run.cmd'
              $command = '""{0}" >> "{1}" 2>&1"' -f $runCmd, $log
              Start-Process cmd.exe -ArgumentList '/d','/s','/c',$command -WorkingDirectory $targetRoot -WindowStyle Hidden | Out-Null
              Start-Sleep -Seconds 5
              Record 'runner_started=true'
            }
            else {
              Record 'runner_started=already'
            }
          }
          catch {
            $failure = $_
            $message = ([string]$_.Exception.Message) -replace '[\r\n]+', ' '
            Record "error_type=$($_.Exception.GetType().FullName)"
            Record "error_message=$message"
          }
          finally {
            $lines | Set-Content -Encoding UTF8 $reportPath
          }

          if ($null -ne $failure) {
            throw $failure
          }

      - name: Persist bootstrap report
        if: always()
        run: |
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'kabuto-runner-bootstrap.txt'
          if (-not (Test-Path $reportPath)) {
            @(
              "timestamp=$([DateTime]::UtcNow.ToString('o'))",
              'bootstrap_report_missing=true',
              "step_outcome=${{ steps.bootstrap.outcome }}"
            ) | Set-Content -Encoding UTF8 $reportPath
          }
          Get-Content $reportPath

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabuto-runner-bootstrap-${{ github.run_id }}
          path: kabuto-runner-bootstrap.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when bootstrap did not complete
        if: steps.bootstrap.outcome == 'failure'
        run: exit 1
