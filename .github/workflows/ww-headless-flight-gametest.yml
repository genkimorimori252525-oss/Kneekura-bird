name: WW Headless Flight GameTest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ww-debug-benchmark/**'
      - '.github/workflows/ww-headless-flight-gametest.yml'

concurrency:
  group: ww-headless-flight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-flight:
    name: Full flight (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - aircraft: warfare_wings:a6m
            label: a6m
          - aircraft: warfare_wings:fw190
            label: fw190
          - aircraft: warfare_wings:f4u
            label: f4u
          - aircraft: warfare_wings:f6f
            label: f6f
          - aircraft: warfare_wings:bf109
            label: bf109
          - aircraft: warfare_wings:ki61
            label: ki61
          - aircraft: warfare_wings:ki84
            label: ki84
          - aircraft: warfare_wings:mc202
            label: mc202
          - aircraft: warfare_wings:mig3
            label: mig3
          - aircraft: warfare_wings:p40e
            label: p40e
          - aircraft: warfare_wings:p47n
            label: p47n
          - aircraft: warfare_wings:p51d
            label: p51d
          - aircraft: warfare_wings:spitfire
            label: spitfire
          - aircraft: warfare_wings:yak3
            label: yak3
    env:
      FLIGHT_TEST_TARGET: ${{ matrix.aircraft }}
      FLIGHT_TEST_LABEL: ${{ matrix.label }}
      FLIGHT_TEST_SCENARIO: full
    defaults:
      run:
        working-directory: ww-debug-benchmark

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Cache exact runtime aircraft mods
        id: flight-mod-cache
        uses: actions/cache@v4
        with:
          path: ww-debug-benchmark/flight-test-mods
          key: ww-flight-mods-forge-1.20.1-ia-GsVmbbkj-ww-q94LN7dV

      - name: Download exact runtime aircraft mods from Modrinth
        if: steps.flight-mod-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p flight-test-mods
          python - <<'PY'
          import json
          import pathlib
          import urllib.request

          versions = {
              'GsVmbbkj': 'immersive_aircraft-1.3.3+1.20.1-forge.jar',
              'q94LN7dV': 'warfare_wings-1.1.4-1.20.1-forge.jar',
          }
          target = pathlib.Path('flight-test-mods')
          for version_id, required_name in versions.items():
              destination = target / required_name
              if destination.is_file() and destination.stat().st_size > 0:
                  print(f'using cached {destination} ({destination.stat().st_size} bytes)')
                  continue
              request = urllib.request.Request(
                  f'https://api.modrinth.com/v2/version/{version_id}',
                  headers={'User-Agent': 'Kamogawa-WW-Autonomous-Flight-Test/1.0'}
              )
              with urllib.request.urlopen(request) as response:
                  metadata = json.load(response)
              files = metadata.get('files', [])
              selected = next((item for item in files if item.get('primary')), files[0])
              download = urllib.request.Request(
                  selected['url'],
                  headers={'User-Agent': 'Kamogawa-WW-Autonomous-Flight-Test/1.0'}
              )
              with urllib.request.urlopen(download) as response, destination.open('wb') as output:
                  output.write(response.read())
              print(f'downloaded {destination} ({destination.stat().st_size} bytes)')
          PY

      - name: Run and verify real-physics headless GameTest
        id: gametest
        continue-on-error: true
        run: |
          run_gametest() {
            set -o pipefail
            gradle --no-daemon --console=plain runGameTestServer \
              -PflightTestAircraft="$FLIGHT_TEST_TARGET" \
              -PflightTestScenario="$FLIGHT_TEST_SCENARIO" \
              2>&1 | tee headless-flight.log
            return ${PIPESTATUS[0]}
          }

          echo "Headless scenario=$FLIGHT_TEST_SCENARIO aircraft=$FLIGHT_TEST_TARGET"
          set +e
          run_gametest
          gradle_status=$?
          if [ "$gradle_status" -ne 0 ] && grep -qE 'downloadAssets FAILED|Failed to get asset|SocketTimeoutException' headless-flight.log; then
            echo 'Retrying once after a transient Minecraft asset download failure.'
            mv headless-flight.log headless-flight-first-attempt.log
            run_gametest
            gradle_status=$?
          fi
          set -e

          python tools/verify_flight_scenario.py \
            --root run-gametest \
            --scenario "$FLIGHT_TEST_SCENARIO" \
            --gradle-status "$gradle_status" \
            --output "run-gametest/scenario-verification-$FLIGHT_TEST_LABEL.json"

      - name: Render visual flight diagnostics
        if: always()
        run: |
          python tools/render_flight_diagnostics.py \
            --root run-gametest \
            --output "run-gametest/flight-diagnostics-$FLIGHT_TEST_LABEL.html" \
            --scenario "$FLIGHT_TEST_SCENARIO"

      - name: Upload headless server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-server-log-${{ matrix.label }}
          path: |
            ww-debug-benchmark/headless-flight*.log
            ww-debug-benchmark/run-gametest/logs/**
            ww-debug-benchmark/run-gametest/crash-reports/**
          if-no-files-found: warn

      - name: Upload measured profiles and autonomous-flight telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-results-${{ matrix.label }}
          path: |
            ww-debug-benchmark/run-gametest/**/wwdebug/**
            ww-debug-benchmark/run-gametest/config/warfare_wings/flight_profiles.json
            ww-debug-benchmark/run-gametest/scenario-verification-*.json
            ww-debug-benchmark/run-gametest/flight-diagnostics-*.html
          if-no-files-found: warn

      - name: Fail after preserving GameTest diagnostics
        if: steps.gametest.outcome == 'failure'
        run: |
          tail -n 320 headless-flight.log
          exit 1
