name: WW Headless Flight GameTest

on:
  workflow_dispatch:
    inputs:
      aircraft:
        description: 'Aircraft entity id, or all for every fighter'
        required: true
        default: 'warfare_wings:a6m'
        type: string
      scenario:
        description: 'Validation starting point'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - landing
          - stall
          - turn
          - terrain
          - targeting
          - weapons
          - formation
          - dogfight
          - dogfight_crossing
          - dogfight_energy
          - dogfight_evasive
          - dogfight_mutual
  pull_request:
    paths:
      - 'ww-debug-benchmark/**'
      - '.github/workflows/ww-headless-flight-gametest.yml'

# Runs on the single self-hosted runner. A superseded scenario for the same ref may be
# cancelled, but this must never share a group with the physics qualifications, which use
# ww-selfhosted-physics with cancel-in-progress false.
concurrency:
  group: ww-headless-flight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-flight:
    name: Headless flight (${{ matrix.scenario }})
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.scenario) || '["dogfight_mutual"]') }}
    env:
      FLIGHT_TEST_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.aircraft || (matrix.scenario == 'dogfight_energy' && 'warfare_wings:p47n' || 'warfare_wings:a6m') }}
      FLIGHT_TEST_SCENARIO: ${{ matrix.scenario }}
    defaults:
      run:
        shell: powershell
        working-directory: ww-debug-benchmark

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Activate cached Gradle 8.8
        working-directory: ${{ github.workspace }}
        run: .\tools\JollyRunnerHub\Use-LocalGradle.ps1 -Version 8.8

      - name: Cache exact runtime aircraft mods
        id: flight-mod-cache
        uses: actions/cache@v4
        with:
          path: ww-debug-benchmark/flight-test-mods
          key: ww-flight-mods-forge-1.20.1-ia-GsVmbbkj-ww-q94LN7dV

      - name: Download exact runtime aircraft mods from Modrinth
        if: steps.flight-mod-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force flight-test-mods | Out-Null
          @'
          import json
          import pathlib
          import urllib.request

          versions = {
              "GsVmbbkj": "immersive_aircraft-1.3.3+1.20.1-forge.jar",
              "q94LN7dV": "warfare_wings-1.1.4-1.20.1-forge.jar",
          }
          target = pathlib.Path("flight-test-mods")
          for version_id, required_name in versions.items():
              destination = target / required_name
              if destination.is_file() and destination.stat().st_size > 0:
                  print(f"using cached {destination} ({destination.stat().st_size} bytes)")
                  continue
              request = urllib.request.Request(
                  f"https://api.modrinth.com/v2/version/{version_id}",
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(request) as response:
                  metadata = json.load(response)
              files = metadata.get("files", [])
              if not files:
                  raise RuntimeError(f"Modrinth version {version_id} returned no files")
              selected = next((item for item in files if item.get("primary")), files[0])
              download = urllib.request.Request(
                  selected["url"],
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(download) as response, destination.open("wb") as output:
                  output.write(response.read())
              print(f"downloaded {destination} ({destination.stat().st_size} bytes)")
          '@ | python -

      - name: Purge previous scenario state
        run: |
          # The Python verifiers select telemetry and validation summaries by newest mtime,
          # so residue from an earlier run on this persistent runner can produce a false pass.
          # server.properties is tracked; everything else under run-gametest is disposable.
          foreach ($dir in @('run-gametest/world', 'run-gametest/logs', 'run-gametest/crash-reports')) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force -ErrorAction Stop }
          }
          Get-ChildItem -Path . -Filter 'headless-flight*.log' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Output 'Scenario state purged.'

      - name: Inventory Warfare Wings weapon APIs
        if: matrix.scenario == 'terrain'
        run: |
          New-Item -ItemType Directory -Force run-gametest/api-inventory | Out-Null
          python tools/inspect_weapon_api.py --jar flight-test-mods/warfare_wings-1.1.4-1.20.1-forge.jar --json-output run-gametest/api-inventory/weapon-api-inventory.json --text-output run-gametest/api-inventory/weapon-api-inventory.txt

      - name: Run and verify real-physics headless GameTest
        id: gametest
        continue-on-error: true
        timeout-minutes: 90
        run: |
          $target = $env:FLIGHT_TEST_TARGET
          $scenario = $env:FLIGHT_TEST_SCENARIO
          Write-Output "Headless scenario=$scenario aircraft=$target"

          cmd /d /s /c "gradle --no-daemon --console=plain runGameTestServer -PflightTestAircraft=$target -PflightTestScenario=$scenario > headless-flight.log 2>&1"
          $gradleStatus = $LASTEXITCODE

          # Retry once, and only for a transient Minecraft asset-download failure.
          if ($gradleStatus -ne 0 -and (Test-Path headless-flight.log)) {
            $transient = Select-String -Path headless-flight.log -Pattern 'downloadAssets FAILED|Failed to get asset|SocketTimeoutException' -Quiet
            if ($transient) {
              Write-Output 'Retrying once after a transient Minecraft asset download failure.'
              Move-Item headless-flight.log headless-flight-first-attempt.log -Force
              cmd /d /s /c "gradle --no-daemon --console=plain runGameTestServer -PflightTestAircraft=$target -PflightTestScenario=$scenario > headless-flight.log 2>&1"
              $gradleStatus = $LASTEXITCODE
            }
          }

          if (Test-Path headless-flight.log) { Get-Content headless-flight.log -Tail 320 }

          $verifiers = @{
            'terrain'           = 'tools/verify_terrain_scenario.py'
            'targeting'         = 'tools/verify_targeting_scenario.py'
            'weapons'           = 'tools/verify_weapons_scenario.py'
            'formation'         = 'tools/verify_formation_scenario.py'
            'dogfight'          = 'tools/verify_dogfight_scenario.py'
            'dogfight_crossing' = 'tools/verify_crossing_dogfight_scenario.py'
            'dogfight_energy'   = 'tools/verify_energy_dogfight_scenario.py'
            'dogfight_evasive'  = 'tools/verify_evasive_dogfight_scenario.py'
            'dogfight_mutual'   = 'tools/verify_mutual_dogfight_scenario.py'
          }
          $output = "run-gametest/scenario-verification-$scenario.json"

          if ($verifiers.ContainsKey($scenario)) {
            python $verifiers[$scenario] --root run-gametest --gradle-status $gradleStatus --output $output
          } else {
            python tools/verify_flight_scenario.py --root run-gametest --scenario $scenario --gradle-status $gradleStatus --output $output
          }
          exit $LASTEXITCODE

      - name: Render visual flight diagnostics
        if: always()
        run: |
          python tools/render_flight_diagnostics.py --root run-gametest --output "run-gametest/flight-diagnostics-$env:FLIGHT_TEST_SCENARIO.html" --scenario $env:FLIGHT_TEST_SCENARIO

      # Diagnostics, not acceptance: this job passes or fails on the gametest step alone.
      # Artifact upload from the self-hosted runner is network-dependent and has already
      # failed an otherwise-green stage-1 build with ECONNRESET (run 30192528907).
      - name: Upload headless server log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-server-log-${{ env.FLIGHT_TEST_SCENARIO }}
          path: |
            ww-debug-benchmark/headless-flight*.log
            ww-debug-benchmark/run-gametest/logs/**
            ww-debug-benchmark/run-gametest/crash-reports/**
          if-no-files-found: warn

      - name: Upload measured profiles and autonomous-flight telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-results-${{ env.FLIGHT_TEST_SCENARIO }}
          path: |
            ww-debug-benchmark/run-gametest/**/wwdebug/**
            ww-debug-benchmark/run-gametest/config/warfare_wings/flight_profiles.json
            ww-debug-benchmark/run-gametest/scenario-verification-*.json
            ww-debug-benchmark/run-gametest/flight-diagnostics-*.html
            ww-debug-benchmark/run-gametest/api-inventory/**
          if-no-files-found: warn

      - name: Fail after preserving GameTest diagnostics
        if: steps.gametest.outcome == 'failure'
        run: |
          if (Test-Path headless-flight.log) { Get-Content headless-flight.log -Tail 320 }
          exit 1
