name: WW Headless Flight GameTest

on:
  workflow_dispatch:
    inputs:
      aircraft:
        description: 'Aircraft entity id, or all for every fighter'
        required: true
        default: 'warfare_wings:a6m'
        type: string
  pull_request:
    paths:
      - 'ww-debug-benchmark/**'
      - '.github/workflows/ww-headless-flight-gametest.yml'

jobs:
  headless-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLIGHT_TEST_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.aircraft || 'warfare_wings:a6m' }}
    defaults:
      run:
        working-directory: ww-debug-benchmark

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download exact runtime aircraft mods from Modrinth
        run: |
          mkdir -p flight-test-mods
          python - <<'PY'
          import json
          import pathlib
          import urllib.request

          versions = {
              # [Forge 1.20.1] Immersive Aircraft 1.3.3
              'GsVmbbkj': 'immersive_aircraft-1.3.3+1.20.1-forge.jar',
              # Warfare Wings 1.1.4 [Forge 1.20.1]
              'q94LN7dV': 'warfare_wings-1.1.4-1.20.1-forge.jar',
          }
          target = pathlib.Path('flight-test-mods')
          for version_id, required_name in versions.items():
              request = urllib.request.Request(
                  f'https://api.modrinth.com/v2/version/{version_id}',
                  headers={'User-Agent': 'Kamogawa-WW-Autonomous-Flight-Test/1.0'}
              )
              with urllib.request.urlopen(request) as response:
                  metadata = json.load(response)
              files = metadata.get('files', [])
              selected = next((item for item in files if item.get('primary')), files[0])
              destination = target / required_name
              download = urllib.request.Request(
                  selected['url'],
                  headers={'User-Agent': 'Kamogawa-WW-Autonomous-Flight-Test/1.0'}
              )
              with urllib.request.urlopen(download) as response, destination.open('wb') as output:
                  output.write(response.read())
              print(f'downloaded {destination} ({destination.stat().st_size} bytes)')
          PY

      - name: Run and verify real-physics headless GameTest
        id: gametest
        continue-on-error: true
        run: |
          run_gametest() {
            gradle --no-daemon --console=plain runGameTestServer \
              -PflightTestAircraft="$FLIGHT_TEST_TARGET" \
              > headless-flight.log 2>&1
          }

          set +e
          run_gametest
          gradle_status=$?
          if [ "$gradle_status" -ne 0 ] && grep -qE 'downloadAssets FAILED|Failed to get asset|SocketTimeoutException' headless-flight.log; then
            echo 'Retrying once after a transient Minecraft asset download failure.'
            mv headless-flight.log headless-flight-first-attempt.log
            run_gametest
            gradle_status=$?
          fi
          set -e

          GRADLE_STATUS="$gradle_status" python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path('run-gametest')
          errors = []
          if int(os.environ['GRADLE_STATUS']) != 0:
              errors.append(f"Gradle GameTest exit code was {os.environ['GRADLE_STATUS']}")

          crash_reports = list(root.glob('crash-reports/*.txt'))
          if crash_reports:
              errors.append('crash report created: ' + ', '.join(str(path) for path in crash_reports))

          summaries = sorted(root.rglob('validation-summary-*.json'),
                             key=lambda path: path.stat().st_mtime)
          if not summaries:
              errors.append('no autonomous-flight validation summary was produced')
          else:
              summary_path = summaries[-1]
              with summary_path.open(encoding='utf-8') as stream:
                  summary = json.load(stream)
              results = summary.get('results') or []
              total = int(summary.get('total') or 0)
              failures = [row for row in results if not row.get('passed')]
              if summary.get('state') != 'complete':
                  errors.append(f"validation state was {summary.get('state')!r}")
              if total <= 0 or len(results) != total:
                  errors.append(f"validation result count was {len(results)}/{total}")
              if failures:
                  first = failures[0]
                  errors.append('first flight failure: '
                                f"{first.get('entity_id')}:{first.get('final_phase')}:{first.get('reason')}")
              print(f'verified validation summary: {summary_path} ({total - len(failures)}/{total} passed)')

          profiles = list(root.rglob('flight_profiles.json'))
          if not profiles:
              errors.append('no measured flight_profiles.json was produced or staged')

          aircraft_logs = list(root.rglob('aircraft/*.jsonl'))
          if not aircraft_logs:
              errors.append('no per-aircraft autonomous-flight telemetry was produced')

          if errors:
              for error in errors:
                  print('ERROR:', error, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload headless server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-server-log
          path: |
            ww-debug-benchmark/headless-flight*.log
            ww-debug-benchmark/run-gametest/logs/**
            ww-debug-benchmark/run-gametest/crash-reports/**
          if-no-files-found: warn

      - name: Upload measured profiles and autonomous-flight telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ww-headless-flight-results
          path: |
            ww-debug-benchmark/run-gametest/**/wwdebug/**
            ww-debug-benchmark/run-gametest/config/warfare_wings/flight_profiles.json
          if-no-files-found: warn

      - name: Fail after preserving GameTest diagnostics
        if: steps.gametest.outcome == 'failure'
        run: |
          tail -n 320 headless-flight.log
          exit 1
