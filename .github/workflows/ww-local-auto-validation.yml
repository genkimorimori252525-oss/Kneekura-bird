name: WW Automatic Local Validation

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ww-automatic-local-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout request metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve pending validation request
        id: request
        run: |
          $requestPath = Join-Path $env:GITHUB_WORKSPACE '.github\local-validation-request.txt'
          if (-not (Test-Path $requestPath)) {
            throw "Missing local validation request file: $requestPath"
          }

          $values = @{}
          foreach ($line in Get-Content $requestPath) {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith('#')) { continue }
            if ($trimmed -notmatch '^([a-z_]+)=(.+)$') {
              throw "Invalid request line: $trimmed"
            }
            $values[$Matches[1]] = $Matches[2].Trim()
          }

          $ref = if ($values.ContainsKey('ref')) { $values['ref'] } else { '' }
          $aircraft = if ($values.ContainsKey('aircraft')) { $values['aircraft'] } else { 'warfare_wings:a6m' }
          $runGameTest = if ($values.ContainsKey('gametest')) { $values['gametest'].ToLowerInvariant() } else { 'true' }

          if ($ref -notmatch '^[A-Za-z0-9._/-]+$') {
            throw "Unsafe repository ref: $ref"
          }
          if ($aircraft -notmatch '^[a-z0-9_.-]+:[a-z0-9_./-]+$') {
            throw "Unsafe aircraft id: $aircraft"
          }
          if ($runGameTest -notin @('true', 'false')) {
            throw "Invalid gametest flag: $runGameTest"
          }

          $needed = $true
          $statusPath = Join-Path $env:GITHUB_WORKSPACE '.github\local-validation-status.json'
          if (Test-Path $statusPath) {
            try {
              $status = Get-Content $statusPath -Raw | ConvertFrom-Json
              $sameRequest = [string]$status.requested_ref -eq $ref `
                -and [string]$status.aircraft -eq $aircraft `
                -and ([string]$status.gametest).ToLowerInvariant() -eq $runGameTest
              if ($sameRequest) {
                $needed = $false
                Write-Host "Request already handled by run $($status.run_id) with status $($status.status)/$($status.conclusion)."
              }
            }
            catch {
              Write-Warning "Ignoring unreadable validation status: $($_.Exception.Message)"
            }
          }

          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "aircraft=$aircraft" >> $env:GITHUB_OUTPUT
          "run_gametest=$runGameTest" >> $env:GITHUB_OUTPUT
          "FLIGHT_TEST_TARGET=$aircraft" >> $env:GITHUB_ENV
          "FLIGHT_TEST_SCENARIO=dogfight_mutual" >> $env:GITHUB_ENV

          Write-Host "Pending validation: $needed"
          Write-Host "Validation ref: $ref"
          Write-Host "Aircraft: $aircraft"
          Write-Host "Run GameTest: $runGameTest"

      - name: No pending validation
        if: steps.request.outputs.needed != 'true'
        run: Write-Host 'No new local validation request.'

      - name: Checkout requested repository ref
        if: steps.request.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve checked-out commit
        if: steps.request.outputs.needed == 'true'
        id: checked_out
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid checked-out commit SHA: $sha"
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Checked-out commit: $sha"

      - name: Persist validation start
        if: steps.request.outputs.needed == 'true'
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_SHA: ${{ steps.checked_out.outputs.sha }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
          REQUEST_GAMETEST: ${{ steps.request.outputs.run_gametest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/local-validation-status.json';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const payload = {
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || '1'),
              status: 'in_progress',
              conclusion: null,
              event: context.eventName,
              head_branch: context.ref.replace('refs/heads/', ''),
              head_sha: context.sha,
              requested_ref: process.env.REQUEST_REF,
              requested_sha: process.env.REQUEST_SHA,
              aircraft: process.env.REQUEST_AIRCRAFT,
              gametest: process.env.REQUEST_GAMETEST,
              url: runUrl,
              updated_at: new Date().toISOString(),
            };
            const content = Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Record automatic local validation start ${context.runId}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Report validation start
        if: steps.request.outputs.needed == 'true'
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_SHA: ${{ steps.checked_out.outputs.sha }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
          REQUEST_GAMETEST: ${{ steps.request.outputs.run_gametest }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Local validation started',
              '',
              `- ref: \`${process.env.REQUEST_REF}\``,
              `- commit: \`${process.env.REQUEST_SHA}\``,
              `- aircraft: \`${process.env.REQUEST_AIRCRAFT}\``,
              `- GameTest: \`${process.env.REQUEST_GAMETEST}\``,
              `- run: ${runUrl}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 15,
              body,
            });

      - name: Set up Java 17
        if: steps.request.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        if: steps.request.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.8
        if: steps.request.outputs.needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build benchmark mod and deterministic simulation
        if: steps.request.outputs.needed == 'true'
        id: benchmark_build
        continue-on-error: true
        working-directory: ww-debug-benchmark
        run: |
          cmd /d /s /c "gradle --no-daemon --console=plain build > build.log 2>&1"
          $status = $LASTEXITCODE
          if (Test-Path build.log) {
            Get-Content build.log -Tail 240
          }
          exit $status

      - name: Upload build diagnostics
        if: always() && steps.request.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ww-auto-local-build-${{ github.run_id }}
          path: |
            ww-debug-benchmark/build.log
            ww-debug-benchmark/build/reports/flight-simulation/report.json
            ww-debug-benchmark/build/libs/*.jar
          if-no-files-found: warn

      - name: Download exact runtime aircraft mods
        if: steps.request.outputs.needed == 'true' && steps.benchmark_build.outcome == 'success' && steps.request.outputs.run_gametest == 'true'
        working-directory: ww-debug-benchmark
        run: |
          New-Item -ItemType Directory -Force flight-test-mods | Out-Null
          @'
          import json
          import pathlib
          import urllib.request

          versions = {
              "GsVmbbkj": "immersive_aircraft-1.3.3+1.20.1-forge.jar",
              "q94LN7dV": "warfare_wings-1.1.4-1.20.1-forge.jar",
          }
          target = pathlib.Path("flight-test-mods")
          for version_id, required_name in versions.items():
              destination = target / required_name
              if destination.is_file() and destination.stat().st_size > 0:
                  print(f"using cached {destination} ({destination.stat().st_size} bytes)")
                  continue
              request = urllib.request.Request(
                  f"https://api.modrinth.com/v2/version/{version_id}",
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(request) as response:
                  metadata = json.load(response)
              files = metadata.get("files", [])
              if not files:
                  raise RuntimeError(f"Modrinth version {version_id} returned no files")
              selected = next((item for item in files if item.get("primary")), files[0])
              download = urllib.request.Request(
                  selected["url"],
                  headers={"User-Agent": "Kamogawa-WW-Local-Runner/1.0"},
              )
              with urllib.request.urlopen(download) as response, destination.open("wb") as output:
                  output.write(response.read())
              print(f"downloaded {destination} ({destination.stat().st_size} bytes)")
          '@ | python -

      - name: Run and verify real-physics reciprocal dogfight
        if: steps.request.outputs.needed == 'true' && steps.benchmark_build.outcome == 'success' && steps.request.outputs.run_gametest == 'true'
        id: gametest
        continue-on-error: true
        working-directory: ww-debug-benchmark
        run: |
          cmd /d /s /c "gradle --no-daemon --console=plain runGameTestServer -PflightTestAircraft=%FLIGHT_TEST_TARGET% -PflightTestScenario=%FLIGHT_TEST_SCENARIO% > headless-flight.log 2>&1"
          $gradleStatus = $LASTEXITCODE
          if (Test-Path headless-flight.log) {
            Get-Content headless-flight.log -Tail 320
          }

          python tools/verify_mutual_dogfight_scenario.py `
            --root run-gametest `
            --gradle-status $gradleStatus `
            --output "run-gametest/scenario-verification-$env:FLIGHT_TEST_SCENARIO.json"

      - name: Render flight diagnostics
        if: always() && steps.request.outputs.needed == 'true' && steps.request.outputs.run_gametest == 'true'
        continue-on-error: true
        working-directory: ww-debug-benchmark
        run: |
          python tools/render_flight_diagnostics.py `
            --root run-gametest `
            --output "run-gametest/flight-diagnostics-$env:FLIGHT_TEST_SCENARIO.html" `
            --scenario "$env:FLIGHT_TEST_SCENARIO"

      - name: Upload GameTest diagnostics
        if: always() && steps.request.outputs.needed == 'true' && steps.request.outputs.run_gametest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ww-auto-local-dogfight-mutual-${{ github.run_id }}
          path: |
            ww-debug-benchmark/headless-flight*.log
            ww-debug-benchmark/run-gametest/**/wwdebug/**
            ww-debug-benchmark/run-gametest/logs/**
            ww-debug-benchmark/run-gametest/crash-reports/**
            ww-debug-benchmark/run-gametest/config/warfare_wings/flight_profiles.json
            ww-debug-benchmark/run-gametest/scenario-verification-*.json
            ww-debug-benchmark/run-gametest/flight-diagnostics-*.html
          if-no-files-found: warn

      - name: Resolve validation outcome
        if: always() && steps.request.outputs.needed == 'true'
        id: outcome
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.benchmark_build.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          RUN_GAMETEST: ${{ steps.request.outputs.run_gametest }}
        run: |
          $conclusion = 'success'
          if ($env:PRIOR_JOB_STATUS -eq 'failure' -or $env:BUILD_OUTCOME -eq 'failure') {
            $conclusion = 'failure'
          }
          elseif ($env:RUN_GAMETEST -eq 'true' -and $env:GAMETEST_OUTCOME -ne 'success') {
            $conclusion = 'failure'
          }
          "conclusion=$conclusion" >> $env:GITHUB_OUTPUT
          Write-Host "Validation conclusion: $conclusion"

      - name: Report validation finish
        if: always() && steps.request.outputs.needed == 'true'
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_SHA: ${{ steps.checked_out.outputs.sha }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
          REQUEST_GAMETEST: ${{ steps.request.outputs.run_gametest }}
          VALIDATION_CONCLUSION: ${{ steps.outcome.outputs.conclusion }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Local validation finished',
              '',
              `- status: \`${process.env.VALIDATION_CONCLUSION || 'failure'}\``,
              `- ref: \`${process.env.REQUEST_REF || 'unresolved'}\``,
              `- commit: \`${process.env.REQUEST_SHA || 'unresolved'}\``,
              `- aircraft: \`${process.env.REQUEST_AIRCRAFT || 'unresolved'}\``,
              `- GameTest: \`${process.env.REQUEST_GAMETEST || 'unresolved'}\``,
              `- run: ${runUrl}`,
              '',
              'Build logs and GameTest diagnostics are attached to the workflow run when produced.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 15,
              body,
            });

      - name: Persist validation finish
        if: always() && steps.request.outputs.needed == 'true'
        uses: actions/github-script@v7
        env:
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          REQUEST_SHA: ${{ steps.checked_out.outputs.sha }}
          REQUEST_AIRCRAFT: ${{ steps.request.outputs.aircraft }}
          REQUEST_GAMETEST: ${{ steps.request.outputs.run_gametest }}
          VALIDATION_CONCLUSION: ${{ steps.outcome.outputs.conclusion }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/local-validation-status.json';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const conclusion = process.env.VALIDATION_CONCLUSION || 'failure';
            const payload = {
              run_id: context.runId,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || '1'),
              status: 'completed',
              conclusion,
              event: context.eventName,
              head_branch: context.ref.replace('refs/heads/', ''),
              head_sha: context.sha,
              requested_ref: process.env.REQUEST_REF || null,
              requested_sha: process.env.REQUEST_SHA || null,
              aircraft: process.env.REQUEST_AIRCRAFT || null,
              gametest: process.env.REQUEST_GAMETEST || null,
              url: runUrl,
              updated_at: new Date().toISOString(),
            };
            const content = Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: `Record automatic local validation finish ${context.runId}`,
              content,
              ...(sha ? { sha } : {}),
            });

      - name: Fail validation after preserving diagnostics
        if: always() && steps.request.outputs.needed == 'true' && steps.outcome.outputs.conclusion == 'failure'
        run: exit 1
