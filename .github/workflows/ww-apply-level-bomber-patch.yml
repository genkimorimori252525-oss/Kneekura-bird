name: WW Apply Level Bomber Patch

on:
  push:
    branches: [agent/level-bomber-noncombat-autonomy]
    paths:
      - '.github/level-bomber-apply-request.txt'

permissions:
  contents: write

concurrency:
  group: ww-level-bomber-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/level-bomber-noncombat-autonomy
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Validate and apply focused patch
        run: |
          git apply --check .github/level-bomber-noncombat.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply .github/level-bomber-noncombat.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item .github/level-bomber-noncombat.patch
          Remove-Item .github/level-bomber-apply-request.txt
          Remove-Item .github/workflows/ww-apply-level-bomber-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable measured-profile level bomber autonomy"
          git push origin HEAD:agent/level-bomber-noncombat-autonomy
