name: Inspect Kabuto Runner Workload

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-kabuto-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-kabuto-runner
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor == 'genkimorimori252525-oss'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell

    steps:
      - name: Inspect runner and recent Kabuto workflows
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'genkimorimori252525-oss/kabuto'
          $root = 'C:\actions-runner-kabuto'

          Write-Host '=== Repository runner state ==='
          $runnerPayload = ((& gh api "repos/$repo/actions/runners") -join [Environment]::NewLine) | ConvertFrom-Json
          $runnerPayload.runners |
            Select-Object id,name,status,busy,@{n='labels';e={($_.labels.name -join ',')}} |
            Format-Table -AutoSize | Out-String | Write-Host

          Write-Host '=== Recent workflow runs ==='
          $runsPayload = ((& gh api "repos/$repo/actions/runs?per_page=20") -join [Environment]::NewLine) | ConvertFrom-Json
          $runsPayload.workflow_runs |
            Select-Object id,name,event,status,conclusion,head_branch,head_sha,run_number,created_at,updated_at |
            Format-Table -AutoSize | Out-String -Width 260 | Write-Host

          foreach ($run in @($runsPayload.workflow_runs | Where-Object { $_.status -in @('queued','in_progress','pending') } | Select-Object -First 10)) {
            Write-Host "=== Jobs for run $($run.id): $($run.name) [$($run.event)] ==="
            $jobsPayload = ((& gh api "repos/$repo/actions/runs/$($run.id)/jobs?per_page=100") -join [Environment]::NewLine) | ConvertFrom-Json
            $jobsPayload.jobs |
              Select-Object id,name,status,conclusion,runner_name,@{n='labels';e={($_.labels -join ',')}} |
              Format-Table -AutoSize | Out-String -Width 220 | Write-Host
          }

          $persistentLog = Join-Path $root '_diag\jolly-kabuto-persistent.log'
          if (Test-Path $persistentLog) {
            Write-Host '=== Jolly-Kabuto persistent listener log ==='
            Get-Content $persistentLog -Tail 180 |
              ForEach-Object { ([string]$_) -replace '(?i)(token|authorization|access_token)[=: ]+\S+', '$1=***' }
          }
