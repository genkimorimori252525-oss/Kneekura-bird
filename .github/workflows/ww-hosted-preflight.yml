name: WW hosted preflight experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: ww-debug-benchmark
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and run deterministic preflight
        run: gradle --no-daemon --console=plain build
      - name: Upload deterministic preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preflight-report
          path: ww-debug-benchmark/build/reports/flight-simulation/
          if-no-files-found: warn
